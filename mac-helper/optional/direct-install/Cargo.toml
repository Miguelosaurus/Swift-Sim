[package]
name = "swift-sim-direct-install"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
idevice = { git = "https://github.com/mh-mobile/idevice", rev = "89cdb2409643deabab99999286b4c4d091c7c068", default-features = false, features = ["ring", "remote_pairing", "tunnel_tcp_stack", "rsd", "afc", "installation_proxy"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4"
plist = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
