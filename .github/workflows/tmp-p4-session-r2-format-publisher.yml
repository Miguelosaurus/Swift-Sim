name: Temporary P4 Session R2 Format Publisher

on:
  push:
    branches:
      - agent/tmp-p4-session-r2-format-publisher

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 99dc606c4b297f12f65a20df8b0a10743a410dba
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier mac-helper/src/persistence/sessionLegacyImport.js --write
      - name: Commit and guarded fast-forward formatted output
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "99dc606c4b297f12f65a20df8b0a10743a410dba"
          test "$(git ls-remote origin refs/heads/agent/tmp-p4-session-r2-formatted-output | cut -f1)" = "99dc606c4b297f12f65a20df8b0a10743a410dba"
          test "$(git diff --name-only)" = "mac-helper/src/persistence/sessionLegacyImport.js"
          git config user.name Miguel
          git config user.email serram1994@gmail.com
          git add mac-helper/src/persistence/sessionLegacyImport.js
          git commit -m "P4 session R2 oracle: apply repository formatting"
          test "$(git ls-remote origin refs/heads/agent/tmp-p4-session-r2-formatted-output | cut -f1)" = "99dc606c4b297f12f65a20df8b0a10743a410dba"
          git push origin HEAD:refs/heads/agent/tmp-p4-session-r2-formatted-output
