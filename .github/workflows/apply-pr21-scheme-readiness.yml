name: Apply PR21 Scheme Readiness

on:
  push:
    branches: [agent/main-post-merge-review-round-1]
    paths:
      - .github/workflows/apply-pr21-scheme-readiness.yml

permissions:
  contents: write

concurrency:
  group: apply-pr21-scheme-readiness
  cancel-in-progress: true

jobs:
  transform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/main-post-merge-review-round-1
          fetch-depth: 0
          persist-credentials: true
      - name: Apply and validate transformation
        id: transform
        shell: bash
        run: |
          set +e
          LOG=/tmp/pr21-scheme-readiness.log
          : > "$LOG"
          python3 scripts/apply-pr21-scheme-readiness.py >> "$LOG" 2>&1
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            node --check mac-helper/src/liveReload.js >> "$LOG" 2>&1
            STATUS=$?
          fi
          if [ "$STATUS" -eq 0 ]; then
            node --test test/mainPostMergeIntegration.test.js >> "$LOG" 2>&1
            STATUS=$?
          fi
          cat "$LOG"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            cp "$LOG" docs/PR21_SCHEME_READINESS_DIAGNOSTIC.log
          fi
          exit 0
      - name: Publish self-cleaned candidate
        if: steps.transform.outputs.status == '0'
        env:
          BRANCH: agent/main-post-merge-review-round-1
        run: |
          set -euo pipefail
          git config user.name "swift-sim-review-bot"
          git config user.email "swift-sim-review-bot@users.noreply.github.com"
          git rm .github/workflows/apply-pr21-scheme-readiness.yml scripts/apply-pr21-scheme-readiness.py
          git add -A
          git commit -m "Bind live readiness to the active scheme"
          git push origin "HEAD:${BRANCH}"
      - name: Publish failure diagnostic
        if: steps.transform.outputs.status != '0'
        env:
          BRANCH: agent/main-post-merge-review-round-1
        run: |
          set -euo pipefail
          git config user.name "swift-sim-review-bot"
          git config user.email "swift-sim-review-bot@users.noreply.github.com"
          git add docs/PR21_SCHEME_READINESS_DIAGNOSTIC.log
          git commit -m "Record PR21 scheme transformer failure"
          git push origin "HEAD:${BRANCH}"
          exit 1
