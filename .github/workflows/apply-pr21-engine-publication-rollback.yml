name: Apply PR21 Engine Publication Rollback

on:
  push:
    branches: [agent/main-post-merge-review-round-1]
    paths:
      - .github/workflows/apply-pr21-engine-publication-rollback.yml

permissions:
  contents: write

concurrency:
  group: apply-pr21-engine-publication-rollback
  cancel-in-progress: false

jobs:
  transform:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/main-post-merge-review-round-1
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Apply manual review fix
        run: python3 scripts/apply-pr21-engine-publication-rollback.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused regressions
        run: node --test test/liveEngineOwnershipPreload.test.js test/mainPostMergeIntegration.test.js
      - name: Run repository checks
        run: npm run check
      - name: Validate workflow and release syntax
        run: |
          ruby -e 'require "yaml"; Dir[".github/**/*.{yml,yaml}"].each { |file| YAML.load_file(file); puts "Verified #{file}" }'
          bash -n scripts/codex/build-device.sh scripts/codex/open-simulator-session.sh scripts/release/render-homebrew-formula.sh
      - name: Publish self-cleaned candidate
        env:
          BRANCH: agent/main-post-merge-review-round-1
        run: |
          set -euo pipefail
          git config user.name "swift-sim-review-bot"
          git config user.email "swift-sim-review-bot@users.noreply.github.com"
          git rm .github/workflows/apply-pr21-engine-publication-rollback.yml scripts/apply-pr21-engine-publication-rollback.py
          git add -A
          git commit -m "Roll back failed live-engine publication"
          git push origin "HEAD:${BRANCH}"
