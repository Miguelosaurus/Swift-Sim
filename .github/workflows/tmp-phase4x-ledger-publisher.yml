name: Temporary Phase 4X ledger publisher

on:
  push:
    branches:
      - agent/architecture-consolidation-phase-4x-local-rerun-handoff

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Update Phase 4 program row
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md')
          text = path.read_text()
          old = '| 4 | Repository interfaces and SQLite migration | Pairing tranche implemented through E4; full phase incomplete and draft | [#41, #44–#50, #52–#54](https://github.com/Miguelosaurus/Swift-Sim/pull/54) | Phase 3G / `7367fa2` | Pairing rollback implementation `7ce31e6`; final E4 head `b1fac0d` | Non-pairing domain repositories, production composition, doctor/export, previous-release upgrade, and full cutover evidence remain required |'
          new = '| 4 | Repository interfaces and SQLite migration | Pairing rollback primitives plus device-build live optional SQLite shadow and local-remediation stack through 4X hosted-green; full phase incomplete and draft | [#41, #44–#50, #52–#54, #95–#99, #101–#116](https://github.com/Miguelosaurus/Swift-Sim/pull/116) | Phase 3G / `7367fa2` | Combined device-build remediation head `63ceccd`; pairing E4 remains direct ancestor | Focused real-Mac rerun, device-build cutover/rollback, sessions/remaining domains, doctor/export/corruption, previous-release upgrade, and final Phase 4 gate remain required |'
          if text.count(old) != 1:
              raise SystemExit(f'expected one old Phase 4 row, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate documentation metadata
        run: |
          npm run check:docs
          npm run check:architecture
          git diff --check
      - name: Publish ledger update
        run: |
          rm .github/workflows/tmp-phase4x-ledger-publisher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md .github/workflows/tmp-phase4x-ledger-publisher.yml
          git commit -m 'docs: record Phase 4X remediation checkpoint'
          git push
