name: Apply cancellation follow-up

on:
  pull_request:
    paths:
      - scripts/apply-cancellation-followup.py
      - .github/workflows/apply-cancellation-followup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/open-source-launch-hardening-round-1'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply cancellation fixes
        run: python3 scripts/apply-cancellation-followup.py
      - name: Validate Node and documentation suite
        run: |
          npm ci
          npm run check
      - name: Commit applied fixes
        run: |
          rm scripts/apply-cancellation-followup.py .github/workflows/apply-cancellation-followup.yml
          git add -A
          git config user.name "swift-sim-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "finish active build cancellation hardening"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
