name: Temporary Phase 4V remote base URL correction

on:
  push:
    branches:
      - agent/architecture-consolidation-phase-4v-historical-device-build-upgrade

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Refine historical delivery reconstruction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('mac-helper/src/persistence/deviceBuildLockedLegacySnapshot.js')
          text = source.read_text()
          old = '''  if (!Object.prototype.hasOwnProperty.call(build, "delivery")) {
            build.delivery = {
              mode: "quick-tunnel",
              provider: "cloudflare-quick-tunnel",
              expiresAt: "",
            };
          }
          '''
          new = '''  if (!Object.prototype.hasOwnProperty.call(build, "delivery")) {
            const hasLegacyRemoteBaseUrl =
              typeof build.remoteBaseUrl === "string" && build.remoteBaseUrl.length > 0;
            build.delivery = {
              mode: hasLegacyRemoteBaseUrl ? "custom" : "quick-tunnel",
              provider: hasLegacyRemoteBaseUrl
                ? "user-configured"
                : "cloudflare-quick-tunnel",
              expiresAt: "",
            };
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'historical delivery block count={text.count(old)}')
          source.write_text(text.replace(old, new, 1))

          test = Path('test/deviceBuildLegacyCompatibility.test.js')
          text = test.read_text()
          marker = '''test("legacy snapshot preserves explicit delivery and device-installable semantics", () => {
          '''
          inserted = '''test("legacy snapshot reconstructs custom delivery from a legacy remote base URL", () => {
            const build = legacyBuild();
            build.remoteBaseUrl = "https://legacy.example.test";
            delete build.delivery;

            const parsed = parseDeviceBuildLegacySnapshot(legacyState(build));
            assert.deepEqual(parsed.snapshot.builds[0].delivery, {
              mode: "custom",
              provider: "user-configured",
              expiresAt: "",
            });
          });

          test("legacy snapshot preserves explicit delivery and device-installable semantics", () => {
          '''
          if text.count(marker) != 1:
              raise SystemExit(f'legacy compatibility test marker count={text.count(marker)}')
          test.write_text(text.replace(marker, inserted, 1))
          PY
      - name: Format and focused validation
        run: |
          npx prettier --write mac-helper/src/persistence/deviceBuildLockedLegacySnapshot.js test/deviceBuildLegacyCompatibility.test.js
          node --test test/deviceBuildLegacyCompatibility.test.js
          npm run check:types
          npm run check:architecture
          git diff --check
      - name: Publish correction
        run: |
          rm .github/workflows/tmp-phase4v-remote-base-url-correction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mac-helper/src/persistence/deviceBuildLockedLegacySnapshot.js test/deviceBuildLegacyCompatibility.test.js .github/workflows/tmp-phase4v-remote-base-url-correction.yml
          git commit -m 'fix: preserve historical custom delivery semantics'
          git push
