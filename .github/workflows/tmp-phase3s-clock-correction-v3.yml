name: Temporary Phase 3S Clock Correction Publisher V3

on:
  push:
    branches:
      - agent/tmp-phase3s-clock-correction
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-phase3s-clock-correction-v3
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BASE_SHA: 73e0c131c7d0e7cbbabcf7b4b20292fae84414ae
      PRODUCT_BRANCH: agent/architecture-consolidation-phase-3s-session-runtime-controller
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: 73e0c131c7d0e7cbbabcf7b4b20292fae84414ae
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reuse bounded Clock patch from reviewed publisher
        shell: bash
        run: |
          set -euo pipefail
          git show origin/agent/tmp-phase3s-clock-correction:.github/workflows/tmp-phase3s-clock-correction.yml > /tmp/clock-publisher.yml
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/clock-publisher.yml').read_text()
          start = source.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/apply-clock.py').write_text(script)
          PY
          python3 /tmp/apply-clock.py
      - name: Focused Clock seam tests
        run: node --test test/sessionRuntimeController.test.js test/compatibilityHelperRuntime.test.js
      - name: Strict type gate
        run: npm run check:types
      - name: Commit candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Miguel"
          git config user.email "serram1994@gmail.com"
          git add mac-helper/bin/swift-sim-helper.js mac-helper/src/infrastructure/compatibilityHelperRuntime.js mac-helper/src/sessionRuntimeController.js test/compatibilityHelperRuntime.test.js test/sessionRuntimeController.test.js
          git diff --cached --check
          git commit -m "Phase 3S: inject clock into session runtime"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
      - name: Full Node/package gate without temporary event metadata
        shell: bash
        run: env -u GITHUB_EVENT_PATH -u GITHUB_EVENT_NAME npm run check
      - run: git diff --check
      - name: Publish exact fast-forward correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          CURRENT=$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)
          if [[ "$CURRENT" != "$BASE_SHA" ]]; then
            echo "Product ref moved: expected $BASE_SHA, found $CURRENT" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
