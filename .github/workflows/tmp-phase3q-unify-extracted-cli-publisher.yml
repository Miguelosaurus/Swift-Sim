name: Temporary Phase 3Q Extracted CLI Publisher

on:
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Build, validate, and publish exact Phase 3Q candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_VERIFY_RUN: "31427558750"
          BASE: c92668eee8f17c96346279cc75fc0dd9d5492415
          PRODUCT_BRANCH: agent/architecture-consolidation-phase-3q-unify-extracted-cli-dispatch
        run: |
          set -euo pipefail
          read -r source_status source_conclusion < <(
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Miguelosaurus/Swift-Sim/actions/runs/$SOURCE_VERIFY_RUN" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["status"], d.get("conclusion") or "")'
          )
          test "$source_status" = "completed"
          test "$source_conclusion" = "success"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$BASE"
          git worktree add /tmp/product "$BASE"
          cd /tmp/product
          npm ci

          python3 <<'PY'
          from pathlib import Path

          helper_path = Path("mac-helper/bin/swift-sim-helper.js")
          helper = helper_path.read_text()

          old_qr_import = 'import { printQRCode } from "../src/terminalQRCode.js";\n'
          if helper.count(old_qr_import) != 1:
              raise SystemExit("QR import sentinel missing")
          helper = helper.replace(old_qr_import, '', 1)

          runtime_import_anchor = 'import { createCompatibilityHelperRuntime } from "../src/infrastructure/compatibilityHelperRuntime.js";\n'
          extracted_import = 'import { runExtractedHelperCommand } from "../src/helperCliRuntime.js";\n'
          if helper.count(runtime_import_anchor) != 1 or extracted_import in helper:
              raise SystemExit("extracted CLI import state unexpected")
          helper = helper.replace(runtime_import_anchor, runtime_import_anchor + extracted_import, 1)

          old_runner = '''export async function runCompatibilityHelper(argv = process.argv.slice(2)) {
            initializeCompatibilityRuntime();
            await main(argv);
          }
          '''
          new_runner = '''export async function runCompatibilityHelper(argv = process.argv.slice(2)) {
            if (await runExtractedHelperCommand(argv)) return;
            initializeCompatibilityRuntime();
            await main(argv);
          }
          '''
          if helper.count(old_runner) != 1:
              raise SystemExit("compatibility runner sentinel missing")
          helper = helper.replace(old_runner, new_runner, 1)

          blocks = [
            ('  if (command === "pair") {\n', '  if (command === "setup-status") {\n'),
            ('  if (command === "list-apps") {\n', '  if (command === "delete-app") {\n'),
            ('  if (command === "verify-device-build") {\n', '  if (command === "stop-session") {\n'),
            ('  if (command === "serve-sim-info") {\n', '  throw new Error(`Unknown command: ${command}`);\n'),
          ]
          for start_marker, next_marker in blocks:
              start = helper.find(start_marker)
              end = helper.find(next_marker, start + 1)
              if start < 0 or end < 0:
                  raise SystemExit(f"CLI block sentinel missing: {start_marker.strip()}")
              helper = helper[:start] + helper[end:]

          helper_path.write_text(helper)

          test_path = Path("test/compatibilityHelperImport.test.js")
          test_source = test_path.read_text()
          direct_anchor = 'test("direct compatibility execution still runs the command loop from an empty home", () => {\n'
          new_test = '''test("direct compatibility execution uses extracted commands before full runtime composition", () => {
            const home = mkdtempSync(join(tmpdir(), "swift-sim-helper-extracted-direct-"));
            try {
              const result = spawnSync(process.execPath, [helper.pathname, "serve-sim-info"], {
                encoding: "utf8",
                env: {
                  ...process.env,
                  HOME: home,
                  SWIFT_SIM_SERVE_SIM_COMMAND: "/usr/bin/false",
                },
              });
              assert.equal(result.status, 0, result.stderr);
              assert.equal(result.stderr, "");
              const payload = JSON.parse(result.stdout);
              assert.equal(payload.command, "/usr/bin/false");
              assert.equal(existsSync(join(home, ".swift-sim")), false);
            } finally {
              rmSync(home, { recursive: true, force: true });
            }
          });

          '''
          if test_source.count(direct_anchor) != 1 or 'uses extracted commands before full runtime composition' in test_source:
              raise SystemExit("direct extracted compatibility test anchor missing or duplicate")
          test_source = test_source.replace(direct_anchor, new_test + direct_anchor, 1)

          pairing_assert_anchor = '    assert.equal(existsSync(join(home, ".swift-sim")), true);\n'
          pairing_assert = pairing_assert_anchor + '    assert.equal(existsSync(join(home, ".swift-sim", "pairing.json")), false);\n'
          first_direct = test_source.find('test("direct compatibility execution still runs the command loop from an empty home"')
          first_assert = test_source.find(pairing_assert_anchor, first_direct)
          if first_direct < 0 or first_assert < 0:
              raise SystemExit("direct compatibility state-root assertion sentinel missing")
          test_source = test_source[:first_assert] + pairing_assert + test_source[first_assert + len(pairing_assert_anchor):]
          test_path.write_text(test_source)
          PY

          git diff --check
          node --test --test-concurrency=1 \
            test/compatibilityHelperImport.test.js \
            test/helperCliDispatcher.test.ts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mac-helper/bin/swift-sim-helper.js \
            test/compatibilityHelperImport.test.js

          files="$(git diff --cached --name-only "$BASE" | sort)"
          expected="$(printf '%s\n' \
            mac-helper/bin/swift-sim-helper.js \
            test/compatibilityHelperImport.test.js | sort)"
          test "$files" = "$expected"
          git diff --cached --check
          grep -q 'if (await runExtractedHelperCommand(argv)) return;' mac-helper/bin/swift-sim-helper.js
          ! grep -q 'if (command === "pair")' mac-helper/bin/swift-sim-helper.js
          ! grep -q 'if (command === "list-apps")' mac-helper/bin/swift-sim-helper.js
          ! grep -q 'if (command === "archive-app")' mac-helper/bin/swift-sim-helper.js
          ! grep -q 'if (command === "verify-device-build")' mac-helper/bin/swift-sim-helper.js
          ! grep -q 'if (command === "device-delivery-status")' mac-helper/bin/swift-sim-helper.js
          ! grep -q 'if (command === "device-delivery-stop")' mac-helper/bin/swift-sim-helper.js
          ! grep -q 'if (command === "serve-sim-info")' mac-helper/bin/swift-sim-helper.js

          git commit -m "Phase 3Q: unify extracted CLI dispatch"
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$BASE"

          npm run check
          git diff --check
          test -z "$(git status --porcelain)"

          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$BASE"
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          echo "Published Phase 3Q candidate $candidate"
