name: Temporary Phase 4F-G Ledger Publisher

on:
  push:
    branches:
      - agent/tmp-phase4fg-ledger-publisher

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      SOURCE_HEAD: e8508440459d2f649432e4ce3c02ae84d1997b3a
      OUTPUT_BRANCH: agent/architecture-consolidation-phase-4fg-ledger
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: e8508440459d2f649432e4ce3c02ae84d1997b3a
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Update canonical Phase 4 ledger
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md')
          text = path.read_text()

          old_status = '- Status: The pairing migration tranche through E4 is locally complete in the draft stack; full Phase 4 is incomplete and all production cutover and rollback wiring remains disabled.'
          new_status = '- Status: The pairing migration tranche through E4 plus the device-build 4F/4G repository and locked-source foundation are hosted-green in the draft stack; full Phase 4 is incomplete and all production cutover and rollback wiring remains disabled.'
          if text.count(old_status) != 1:
              raise SystemExit('Phase 4 status anchor changed')
          text = text.replace(old_status, new_status)

          anchor = '- Validated E4 implementation: `7ce31e6f859180af213d7d3d52e2dd564bcbd63d`.\n'
          addition = anchor + '- Active continuation head: PR #96 / `e8508440459d2f649432e4ce3c02ae84d1997b3a`, stacked from the hosted-green Phase 3 completion-ledger ancestry and retaining E4 as a direct ancestor.\n'
          if text.count(anchor) != 1:
              raise SystemExit('Phase 4 active-head anchor changed')
          text = text.replace(anchor, addition)

          row = '| E4 — rollback export | [#54](https://github.com/Miguelosaurus/Swift-Sim/pull/54) | #53 / `ec1bd4e` | `3100bc0` | `31316795096` passed | Open, draft, unmerged |\n'
          rows = row + '| 4F — device-build SQLite shadow repository | [#95](https://github.com/Miguelosaurus/Swift-Sim/pull/95) | Phase 3 completion ledger / `94e5686` | `6ddd0ad`; final clean-tree head `bc55ccd` | `31479976397` passed | Open, draft, unmerged |\n' + '| 4G — locked device-build legacy snapshot | [#96](https://github.com/Miguelosaurus/Swift-Sim/pull/96) | #95 / `bc55ccd` | `e850844` | `31481810512` passed | Open, draft, unmerged |\n'
          if text.count(row) != 1:
              raise SystemExit('Phase 4 table E4 row anchor changed')
          text = text.replace(row, rows)

          residual = 'The E4 pairing rollback slice has no remaining finding from its focused audit. Full Phase 4 nevertheless remains incomplete: non-pairing domain repositories, staged production composition, legacy read-only handling, schema/migration/permission/orphan diagnostics, redacted export, corruption guidance, and previous-tag upgrade proof are still required. Production rollback/cutover remains unauthorized, and final persistent-local/device evidence and Miguel merge authorization remain pending.\n'
          replacement = '''The E4 pairing rollback slice has no remaining finding from its focused audit. Phase 4F and 4G now cover the first non-pairing transactional domain boundary for device-build state, but full Phase 4 remains incomplete: device-build import/checkpoint/shadow comparison and authority composition, a production-compatible legacy build-lock identity provider, session-domain repositories/migration, schema/migration/permission/orphan diagnostics, redacted export, corruption guidance, previous-tag upgrade proof, and full cutover/rollback evidence are still required. Production rollback/cutover remains unauthorized, and final persistent-local/device evidence and Miguel merge authorization remain pending.\n\n### Phase 4F — device-build SQLite shadow repository\n\n- PR #95 adds a typed `DeviceBuildStateRepository` for builds, app archive state, artifact-cleanup jobs, and delivery-reference cleanup jobs without changing the live JSON authority.\n- SQLite migration version 6 adds four entity-specific STRICT tables. Full validated entity projections remain preserved as JSON while extracted columns are indexed and CHECK-bound back to the JSON projection, avoiding a new opaque whole-domain blob table.\n- Snapshot replacement is one SQLite transaction across all four collections. Focused evidence proves extension-field round trips, duplicate/pre-validation failure containment, extracted-column mismatch rejection, and rollback to the prior snapshot after a SQL CHECK fails after deletion/insertion has begun.\n- Final clean product tree is `ea33f7b445664b3bd08b9770f5753dbca8f355cc`. The intended implementation commit is `6ddd0ad6910d64b5874fc4444c72397367a24714`; after a transient metadata-tool mistake created a top-level `noop` file, ordinary corrective child `bc55ccdf1af7f9f18c9757ffbefaef63944b7f70` removed it and restored the exact intended tree without history rewriting. Natural corrective Verify #872 / run `31479976397` passed full Node/package, clean Homebrew, YAML/shell, and iOS gates.\n- This slice is migration/shadow infrastructure only. `device-builds.json` remains the sole production source of truth.\n\n### Phase 4G — locked device-build legacy snapshot\n\n- PR #96 / `e8508440459d2f649432e4ce3c02ae84d1997b3a` adds the read-only legacy-source boundary needed before device-build import. It never constructs `DeviceBuildStore`, so migration reads cannot compact state, expire tokens, recover renewals, drain cleanup artifacts, or start maintenance behavior.\n- The reader takes an injected legacy-compatible lock, backs up exact source bytes before parse/version acceptance, normalizes older supported state in memory using the same existing pure build normalizer, preserves legacy-compatible extension fields, and fails closed on malformed/future-version state. It emits deterministic `sourceRevision`, normalized `projectionHash`, source version, record count, and deeply frozen projection evidence.\n- The migration callback must remain synchronous, keeping later import work inside the source-lock lifetime. Strengthened oracle run `31481348264` proves the reader's own source read, backup write, and backup verification read all occur while the lock is held.\n- Authoritative natural Verify #873 / run `31481810512` passed full Node/package, isolated clean Homebrew, YAML/shell, and iOS gates on the exact product head.\n- Production lock composition is deliberately deferred: the legacy build lock uses a PID-reuse-safe `/bin/ps ... lstart` `startedAt` token whose representation differs from the generic kernel identity provider. A later composition slice must supply an exactly compatible identity provider rather than weakening stale-lock checks to PID-only behavior.\n- No SQLite import, shadow observer, production reader/writer, authority switch, legacy deletion, or real-user-state operation is introduced.\n'''
          if text.count(residual) != 1:
              raise SystemExit('Phase 4 residual anchor changed')
          text = text.replace(residual, replacement)

          path.write_text(text)
          PY
      - name: Validate documentation-only delta
        shell: bash
        run: |
          git diff --check
          npm run check:docs
          unset GITHUB_EVENT_PATH GITHUB_EVENT_NAME
          npm run check:architecture
          test "$(git diff --name-only)" = "docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md"
      - name: Commit ledger update
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git ls-remote origin refs/heads/$OUTPUT_BRANCH | cut -f1)" = "$SOURCE_HEAD"
          git config user.name Miguel
          git config user.email serram1994@gmail.com
          git add docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md
          git commit -m "docs: record Phase 4F-G device-build migration foundation"
      - name: Guard and publish ledger update
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/$OUTPUT_BRANCH | cut -f1)" = "$SOURCE_HEAD"
          git push origin HEAD:refs/heads/$OUTPUT_BRANCH
