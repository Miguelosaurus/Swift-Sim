name: Manual review round 2 PR patch

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/main-post-merge-review-round-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/main-post-merge-review-round-1
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed fixes
        run: python3 scripts/manual-review-round2.py
      - name: Install dependencies
        run: npm ci
      - name: Focused adversarial regressions
        run: node --test test/liveEngineOwnershipPreload.test.js test/mainPostMergeIntegration.test.js
      - name: Check JavaScript syntax
        run: node scripts/check-js-syntax.js
      - name: Check documentation links
        run: npm run check:docs
      - name: Commit reviewed fixes
        shell: bash
        run: |
          git config user.name "Swift Sim Manual Review"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close manual review round 2 findings"
          git push origin HEAD:agent/main-post-merge-review-round-1
