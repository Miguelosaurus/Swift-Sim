name: Manual review round 2 PR patch

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/main-post-merge-review-round-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/main-post-merge-review-round-1
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and apply reviewed patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/manual-review-round2-v2.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/manual-review-round2.py').write_text(script)
          PY
          python3 /tmp/manual-review-round2.py
          rm -f .github/workflows/manual-review-round2-pr.yml
      - name: Install dependencies
        run: npm ci
      - name: Focused adversarial regressions
        run: node --test test/liveEngineOwnershipPreload.test.js test/mainPostMergeIntegration.test.js
      - name: Complete Node and release suite
        run: npm run check
      - name: Commit reviewed fixes
        shell: bash
        run: |
          git config user.name "Swift Sim Manual Review"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close manual review round 2 findings"
          git push origin HEAD:agent/main-post-merge-review-round-1
