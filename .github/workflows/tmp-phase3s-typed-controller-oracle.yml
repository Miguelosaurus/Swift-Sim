name: Temporary Phase 3S Typed Controller Oracle

on:
  pull_request:

permissions:
  contents: read

jobs:
  type-oracle:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Apply correction and run focused type oracle
        run: python3 .github/tmp/phase3s-typed-controller-oracle.py
