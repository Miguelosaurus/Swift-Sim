name: Temporary Phase 3T Setup Status Publisher

on:
  push:
    branches:
      - agent/tmp-phase3t-setup-status-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-phase3t-v2-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BASE_SHA: 387e69f35dc3e5adec71d30f03fc1983abdf3292
      PRODUCT_BRANCH: agent/architecture-consolidation-phase-3t-setup-status-runtime
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: 387e69f35dc3e5adec71d30f03fc1983abdf3292
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply validated Phase 3T candidate
        shell: bash
        run: |
          set -euo pipefail
          git show origin/agent/tmp-phase3t-setup-status-v2:.github/tmp/phase3t-v2.py > /tmp/phase3t-v2.py
          git show origin/agent/tmp-phase3t-setup-status-v2:.github/tmp/phase3t-v2-typefix.py > /tmp/phase3t-v2-typefix.py
          git show origin/agent/tmp-phase3t-setup-status-v2:.github/tmp/phase3t-v2-ratchet.py > /tmp/phase3t-v2-ratchet.py
          python3 /tmp/phase3t-v2.py
          python3 /tmp/phase3t-v2-typefix.py
          python3 /tmp/phase3t-v2-ratchet.py
      - name: Focused behavior tests
        run: node --test test/setupStatusService.test.js test/compatibilityHelperImport.test.js test/confirmationRound5AsyncCommandGroup.test.js
      - name: Strict type gate
        run: npm run check:types
      - name: Commit exact product candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Miguel"
          git config user.email "serram1994@gmail.com"
          git add \
            mac-helper/bin/swift-sim-helper.js \
            mac-helper/src/commands/setupStatusService.js \
            test/setupStatusService.test.js \
            scripts/architecture/baseline-policy.json
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "4"
          git commit -m "Phase 3T: extract setup status runtime"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
      - name: Full Node/package gate
        shell: bash
        run: env -u GITHUB_EVENT_PATH -u GITHUB_EVENT_NAME npm run check
      - run: git diff --check
      - name: Guard and publish exact fast-forward product commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          CURRENT=$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)
          if [[ "$CURRENT" != "$BASE_SHA" ]]; then
            echo "Product ref moved: expected $BASE_SHA, found $CURRENT" >&2
            exit 1
          fi
          CURRENT=$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)
          if [[ "$CURRENT" != "$BASE_SHA" ]]; then
            echo "Product ref moved before publication: expected $BASE_SHA, found $CURRENT" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
