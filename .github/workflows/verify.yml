name: Verify

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply final route lifecycle fix
        if: ${{ github.head_ref == 'agent/main-post-merge-review-round-1' }}
        run: |
          set -euo pipefail
          if [[ ! -f scripts/final_route_lock_fix.py ]]; then
            exit 0
          fi
          python3 scripts/final_route_lock_fix.py
          git rm -f scripts/final_route_lock_fix.py
          git checkout c7090b14c6f1fd12af9c311b1954b79b00c415ac -- .github/workflows/verify.yml
          git config user.name "swift-sim-review-bot"
          git config user.email "swift-sim-review-bot@users.noreply.github.com"
          git add -A
          git commit -m "Serialize production live routing"
          git push origin HEAD:agent/main-post-merge-review-round-1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: |
          ruby -e 'require "yaml"; Dir[".github/**/*.{yml,yaml}"].each { |file| YAML.load_file(file); puts "Verified #{file}" }'
      - run: bash -n scripts/codex/build-device.sh scripts/codex/open-simulator-session.sh scripts/release/render-homebrew-formula.sh
      - name: Run iOS app tests
        timeout-minutes: 12
        run: |
          set -euo pipefail
          DESTINATION=$(python3 - <<'PY'
          import json, subprocess
          payload = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime, devices in payload.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  udid = device.get("udid")
                  if udid:
                      print(f"platform=iOS Simulator,id={udid}")
                      raise SystemExit
          raise SystemExit("No available iOS Simulator found")
          PY
          )
          xcodebuild test \
            -project Companion/SwiftSimCompanion.xcodeproj \
            -scheme SwiftSimCompanion \
            -destination "$DESTINATION" \
            -configuration Debug \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 30 \
            -maximum-test-execution-time-allowance 60
