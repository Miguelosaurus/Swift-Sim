name: Verify

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/arch-ws-P4-CUTOVER-IMPLEMENTATION-serialized-authority-transition'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Detect formatter checkpoint
        id: formatter
        shell: bash
        run: |
          if grep -Fq '"check:format": "prettier --check' package.json; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.formatter.outputs.needed == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install pinned formatter
        if: steps.formatter.outputs.needed == 'true'
        run: npm ci
      - name: Apply pinned Prettier checkpoint
        if: steps.formatter.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            mac-helper/src/commands/deviceBuildArtifactDoctorProjection.js \
            mac-helper/src/commands/phase4AuthorityDiagnosticProjection.js \
            mac-helper/src/commands/phase4OperatorDiagnostics.js \
            mac-helper/src/persistence/phase4AuthoritySchema.js \
            mac-helper/src/persistence/phase4CutoverCoordinator.js \
            mac-helper/src/persistence/phase4DeviceBuildStore.js \
            mac-helper/src/persistence/phase4PairingStores.js \
            mac-helper/src/persistence/phase4ProductionStores.js \
            mac-helper/src/persistence/phase4RollbackCoordinator.js \
            mac-helper/src/persistence/phase4SessionStore.js \
            mac-helper/src/persistence/sqlitePhase4AuthorityRepository.js
          git show HEAD^^:package.json > package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json mac-helper/src/commands mac-helper/src/persistence
          git diff --cached --check
          git commit -m 'style: format Phase 4 cutover sources'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
