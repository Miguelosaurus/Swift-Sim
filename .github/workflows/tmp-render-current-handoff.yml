- The canonical documentation/handoff branch is PR #94, `agent/architecture-consolidation-phase-3-completion-ledger`. Resolve its live head first; documentation SHAs may have advanced after this prompt was written.
- Phase 4's SQLite/pairing tranche through E4 is already in the final Phase 3 ancestry. `b1fac0df3360fdc68ca76d910e467b8a1f4944d7` is a direct ancestor of `07a8295f…`. Do not replay/rebase/re-port it.
- Full Phase 4 is still incomplete. Production SQLite authority, migration cutover/rollback, and Phase 5 preload removal are NOT authorized.
- All Phase 2+ architecture PRs remain draft/unmerged. Do not merge or force-push; final persistent-local/device verification belongs to the Luna handoff and final merge requires Miguel's explicit authorization.

Your immediate task is to continue Phase 4 correctly, not to start Phase 5:

1. Perform a read-only inventory of every current writable JSON/domain-state store and classify it under ADR-0003 as transactional domain state vs runtime/process/filesystem evidence.
2. Map the existing SQLite schema/repositories/import/shadow/cutover machinery against that inventory.
3. Identify the missing non-pairing repositories and cross-domain transactional boundaries.
4. Update the Phase 4 progress plan with the resulting tranche order.
5. Implement the smallest coherent next non-pairing repository/import/shadow slice without switching production authority in that same PR.
6. Validate adversarially with real temporary SQLite/filesystem tests, strict types, architecture debt checks, full Node/package gates, and hosted Verify where the harness permits.
7. Continue autonomously through meaningful bounded Phase 4 slices, keeping docs current as you go. Do not stop merely because one intermediate slice is green; stop at a genuine coherent checkpoint, a real blocker, or when a fresh handoff is required.

