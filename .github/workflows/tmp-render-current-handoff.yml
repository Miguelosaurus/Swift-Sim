name: Temporary Current Handoff Renderer

on:
  push:
    branches:
      - agent/tmp-handoff-render
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BASE_SHA: 8e372d98f324b17101ae71c33bc0c7f016eb5e0e
      OUTPUT_BRANCH: agent/tmp-handoff-output
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: 8e372d98f324b17101ae71c33bc0c7f016eb5e0e
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Render canonical handoff docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          progress_path = Path('docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md')
          progress = progress_path.read_text()

          old_phase3 = "| 3 | Helper and HTTP decomposition | Partial implementation through corrective 3M; draft stack unmerged | [#34–#40, #56–#60, #63](https://github.com/Miguelosaurus/Swift-Sim/pull/63) | Phase 2 final metadata / `f21e344` | Corrective implementation `ba97946` | HTTP route families are extracted; lifecycle/reconciliation/process behavior, module-global runtime construction, and remaining CLI composition still prevent the Phase 3 gate |"
          new_phase3 = "| 3 | Helper and HTTP decomposition | **Implementation gate complete; draft stack unmerged** | [final corrective PR #93](https://github.com/Miguelosaurus/Swift-Sim/pull/93) | Phase 2 final metadata / `f21e344` | `07a8295` (tree `c025296`) | Hosted gate and exact-head closure audit passed; final Luna local/device evidence and Miguel merge authorization remain pending |"
          old_phase4 = "| 4 | Repository interfaces and SQLite migration | Pairing tranche implemented through E4; full phase incomplete and draft | [#41, #44–#50, #52–#54](https://github.com/Miguelosaurus/Swift-Sim/pull/54) | Phase 3G / `7367fa2` | Pairing rollback implementation `7ce31e6`; final E4 head `b1fac0d` | Non-pairing domain repositories, production composition, doctor/export, previous-release upgrade, and full cutover evidence remain required |"
          new_phase4 = "| 4 | Repository interfaces and SQLite migration | Pairing tranche through E4 validated and already in final Phase 3 ancestry; full phase incomplete | [#41, #44–#50, #52–#54](https://github.com/Miguelosaurus/Swift-Sim/pull/54) | historical `7367fa2`; continue from `07a8295` | E4 final `b1fac0d` | Non-pairing domain repositories, staged composition/shadow evidence, authority cutover/rollback, doctor/export/corruption guidance, and previous-release upgrade proof remain required |"

          if progress.count(old_phase3) != 1:
              raise SystemExit('Expected exactly one stale Phase 3 program-status row')
          if progress.count(old_phase4) != 1:
              raise SystemExit('Expected exactly one Phase 4 program-status row')
          progress = progress.replace(old_phase3, new_phase3)
          progress = progress.replace(old_phase4, new_phase4)

          continuation_marker = "| 10 | Product reliability proof | Not started | — | — | — | External-beta evidence cannot be manufactured by repository automation |\n\n## Mandatory architecture checkpoints"
          continuation = """| 10 | Product reliability proof | Not started | — | — | — | External-beta evidence cannot be manufactured by repository automation |

## Current continuation handoff

- Immutable validated runtime/product head: PR #93 / `07a8295f0221f1f2007cb1f01c99a5998f371f8a`; product tree `c025296d0a458809809b948e16d47ffa6f8c82fd`.
- Canonical documentation/handoff branch: PR #94 / `agent/architecture-consolidation-phase-3-completion-ledger`. Resolve its live head before any new write; do not assume a documentation SHA copied into an older chat is still current.
- Phase 3 is implementation-gate complete. Natural Verify #865 / run `31444358586` passed the full Node/package, architecture/type/format/lint, isolated clean Homebrew, YAML/shell, and iOS gates. Exact-head closure audit `31444581201` passed 88/88 focused Phase 3 contracts plus route-authority, entrypoint-composition, architecture, strict-type, and diff-hygiene checks.
- Phase 4 E4 final documentation head `b1fac0df3360fdc68ca76d910e467b8a1f4944d7` is a direct ancestor of the final Phase 3 head. **Do not replay, rebase, or re-port the validated SQLite/pairing tranche.** Continue forward from the current ancestry.
- Start the next session with [the current handoff](NEXT_AGENT_HANDOFF_ARCHITECTURE_CONSOLIDATION_CURRENT.md) and [the paste-ready current-agent prompt](NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_CURRENT.md).

## Mandatory architecture checkpoints"""
          if progress.count(continuation_marker) != 1:
              raise SystemExit('Could not locate program-status continuation marker')
          progress = progress.replace(continuation_marker, continuation)

          old_phase4_header = """- Status: The pairing migration tranche through E4 is locally complete in the draft stack; full Phase 4 is incomplete and all production cutover and rollback wiring remains disabled.
- Full Phase 4 stack base: Phase 3G head `7367fa2574ff8fa88499be7c8b02ece72ff11ffa`.
- Pairing E stack base: Phase 4D2 head `1364fa1ea570840e779b4f6b65195b3bb4433ac6`.
- Validated E4 implementation: `7ce31e6f859180af213d7d3d52e2dd564bcbd63d`.
- Remaining Phase 4 finalization is required by the master plan. The local E5 label is not an optional waiver for unfinished domain repositories, composition, diagnostics, upgrade, or phase-gate evidence."""
          new_phase4_header = """- Status: The pairing migration tranche through E4 is validated in the draft ancestry; full Phase 4 is incomplete and all production cutover and rollback wiring remains disabled.
- Historical Phase 4A stack base: Phase 3G head `7367fa2574ff8fa88499be7c8b02ece72ff11ffa`.
- Pairing E stack base: Phase 4D2 head `1364fa1ea570840e779b4f6b65195b3bb4433ac6`.
- Validated E4 implementation: `7ce31e6f859180af213d7d3d52e2dd564bcbd63d`; final E4 documentation head `b1fac0df3360fdc68ca76d910e467b8a1f4944d7`.
- Current continuation base: final Phase 3 product head `07a8295f0221f1f2007cb1f01c99a5998f371f8a`, with the current docs/handoff on PR #94. The E4 head is already an ancestor, so no reconciliation replay is needed.
- Remaining Phase 4 finalization is required by the master plan. The local E5 label is not an optional waiver for unfinished domain repositories, composition, diagnostics, upgrade, or phase-gate evidence."""
          if progress.count(old_phase4_header) != 1:
              raise SystemExit('Could not locate Phase 4 status header')
          progress = progress.replace(old_phase4_header, new_phase4_header)
          progress_path.write_text(progress)

          readme_path = Path('docs/internal/README.md')
          readme = readme_path.read_text()
          old_link = "- [Next Agent Prompt — Phase 0](plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_PHASE0.md)"
          new_links = """- [Current Architecture Handoff](plans/NEXT_AGENT_HANDOFF_ARCHITECTURE_CONSOLIDATION_CURRENT.md)
- [Current Next-Agent Prompt](plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_CURRENT.md)
- [Historical Phase 0 Next-Agent Prompt](plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_PHASE0.md)"""
          if readme.count(old_link) != 1:
              raise SystemExit('Could not locate stale Phase 0 prompt navigation')
          readme = readme.replace(old_link, new_links)
          readme_path.write_text(readme)

          handoff = r'''# Architecture Consolidation — Current Agent Handoff

Date prepared: 2026-08-11

This is the canonical compact handoff for the next repository agent. It does not replace the master plan, invariants, execution guide, checkpoint protocol, batched-execution amendment, ADRs, tests, PR bodies, or Git history. Read those sources before changing code.

## 1. Read first, in this order

1. `docs/internal/README.md`
2. `docs/internal/plans/ARCHITECTURE_CONSOLIDATION_MASTER_PLAN.md`
3. `docs/internal/plans/ARCHITECTURE_CONSOLIDATION_INVARIANTS.md`
4. `docs/internal/plans/ARCHITECTURE_CONSOLIDATION_EXECUTION_GUIDE.md`
5. `docs/internal/plans/ARCHITECTURE_CONSOLIDATION_BATCHED_EXECUTION_AMENDMENT.md`
6. `docs/internal/plans/ARCHITECTURE_CONSOLIDATION_CHECKPOINT_PROTOCOL.md`
7. `docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md`
8. ADR-0003: `docs/internal/adr/ADR-0003-sqlite-domain-state-filesystem-runtime.md`
9. This handoff and `NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_CURRENT.md`

If operating through the ChatGPT GitHub connector, also read and obey the repository-publication instructions Miguel supplied at `https://pastebin.com/raw/rvyEUuAW`. In particular: preserve exact validated history, use guarded non-force fast-forwards, and make multi-file product publications atomically rather than as a sequence of partially visible file writes.

## 2. Non-negotiable execution rules

- Do not merge any architecture-consolidation PR. All Phase 2+ work remains draft/unmerged until final Luna verification and Miguel's explicit merge authorization.
- Do not force-push, rewrite, squash away, or rebase already validated history merely to make the stack look cleaner.
- Do not enable production SQLite authority, destructive migration, production rollback, or compatibility-preload removal merely because supporting code exists.
- Do not start Phase 5 until the full Phase 4 gate is genuinely complete. Checkpoint 2 is mandatory after Phase 5 and before Phase 6.
- Preserve existing public/private route behavior, fail-closed authorization, persisted public contracts, process identity rules, and crash-recovery behavior.
- Keep local/hardware evidence honest: hosted clean Homebrew and Simulator gates are real, but persistent local Mac, physical-device, network/signing, sleep/wake, and release-candidate evidence remains for the final Luna handoff where the plan says so.
- When a guard exposes stale debt allowance, shrink only the mutable cap; never rewrite the immutable architecture baseline to make a candidate pass.
- Prefer bounded responsibility slices. Do not combine storage migration, process-ownership rewrites, preload removal, or user-visible features in one PR.

## 3. Exact current state

### Phase 3 — complete implementation gate

Immutable final Phase 3 runtime/product head:

`07a8295f0221f1f2007cb1f01c99a5998f371f8a`

Product tree:

`c025296d0a458809809b948e16d47ffa6f8c82fd`

Final corrective PR: #93 (`agent/architecture-consolidation-phase-3v-helper-presentation`). It remains open, draft, mergeable, and unmerged.

Evidence:

- natural Verify #865 / run `31444358586`: full Node/package gate, architecture/types/format/lint, isolated clean Homebrew installation/service, YAML/shell validation, and iOS Simulator tests all passed;
- exact-head closure audit `31444581201`: 88/88 focused Phase 3 contract tests, import-inert compatibility helper, atomic lifecycle authorization/recovery, every route authorization matrix, matrix-complete public-delivery allow/404 proof, all six route modules free of raw process/filesystem authority, bounded helper-entrypoint composition, architecture debt gate, strict types, and diff hygiene;
- `mac-helper/bin/swift-sim-helper.js` is 354 lines on the exact clean tree and is now primarily composition/wiring.

The later corrective stack deliberately preserved earlier validated history. Important current PRs include #77, #80, #85/#87, #89, #91, #92, and #93. Do not reopen Phase 3 unless a concrete regression is found.

### Canonical docs/handoff

PR #94: `agent/architecture-consolidation-phase-3-completion-ledger`.

Resolve PR #94's live head before writing. The immutable runtime head above is the important code base; documentation commits may advance after this file is prepared.

### Phase 4 — partially implemented, not cut over

The generic SQLite + pairing migration tranche is already in the final Phase 3 ancestry. This was explicitly verified: E4 final documentation head

`b1fac0df3360fdc68ca76d910e467b8a1f4944d7`

is a direct ancestor of `07a8295f…` (final Phase 3 is 39 commits ahead). Therefore **do not replay/rebase/re-port Phase 4A–E4**.

Validated historical Phase 4 stack:

- #41 — SQLite foundation, implementation `d653b3f`, Verify `31026437268`;
- #44 — pairing SQLite repositories, `0f8e65a`, Verify `31028680549`;
- #45 — pairing import/resume, `6781dea`, Verify `31033205619`;
- #46 — pairing shadow comparison, `7443e7e`, Verify `31036122449`;
- #47 — pairing shadow observer, `1364fa1`, Verify `31039161870`;
- #48/#50/#49 — pairing authority-state / locked snapshot / authority selector;
- #52/#53 — cutover preparation and coordinator;
- #54 — pairing rollback export; final documentation head `b1fac0d`, final Verify `31317114243`.

Those pieces are intentionally not production-authoritative. E4 specifically has no production composition/cutover wiring.

ADR-0003 classifies transactional domain state such as apps, builds, sessions, pairing metadata, recipes, observations, and cleanup jobs as SQLite candidates, while process-ownership journals, runtime leases, lock-owner records, engine handoff records, artifacts/manifests/logs/generated packages remain filesystem/runtime records.

## 4. What remains in Phase 4

The master-plan Phase 4 gate is **not** met. At minimum the next agent must finish:

- non-pairing typed domain repository coverage and normalized SQLite tables/migrations;
- one-time import/resume and duplicate-prevention for those domains;
- staged shadow reads/comparisons with actionable divergence diagnostics;
- production composition only after shadow evidence, then a fenced single-writer authority cutover with a defined read-only rollback window;
- legacy read-only handling after cutover rather than permanent dual writable truth;
- `swift-sim doctor` checks for schema/migration state, database permissions, corruption/integrity, and orphan artifacts;
- redacted diagnostic/export support and actionable corruption recovery guidance;
- full migration idempotency/interruption proof, repeated-import no-duplicate proof, transactional domain-mutation proof, and rollback readability;
- clean Homebrew **upgrade from the previous tagged release**, not only clean install;
- final Phase 4 repository evidence before Phase 5 begins.

Production SQLite authority and rollback remain unauthorized until this is all proven.

## 5. Recommended first work in the next session

Do not immediately write another pairing slice. First perform a **read-only Phase 4 domain-state inventory on the current ancestry**:

1. enumerate every current writable JSON/domain-state store and its file/lock/backup behavior;
2. classify each record as transactional domain state vs runtime/process/filesystem evidence under ADR-0003;
3. map existing SQLite schema/repositories/import checkpoints against that inventory;
4. identify which non-pairing domains still have no normalized repository/import/shadow path;
5. inspect call sites to determine transactional boundaries and cross-domain invariants;
6. update the Phase 4 section of the progress ledger with the inventory and proposed tranche order before implementing the first new repository slice.

Then choose the **smallest coherent non-pairing domain tranche** that meaningfully reduces custom JSON authority. The first new implementation slice should add repository/schema/import/shadow evidence only; avoid switching production authority in that same PR. Preserve record projections and use real temporary SQLite/filesystem tests plus fault injection.

A sensible sequencing default, subject to the inventory, is:

1. normalized non-pairing repositories + imports/shadow comparison;
2. cross-domain transaction/coherence coverage;
3. staged production composition in shadow/read-only mode;
4. authority cutover with rollback window;
5. doctor/export/corruption recovery;
6. previous-tag Homebrew upgrade and full Phase 4 gate audit.

Do not treat that list as permission to skip the inventory or merge multiple safety transitions into one PR.

## 6. Known tooling/publication facts from the previous session

- This ChatGPT GitHub harness could not rely on a local clone for canonical publication. Temporary GitHub Actions oracles were used to run Node 24/full repository gates, and product refs moved only after exact source/target guards.
- GitHub's architecture inventory intentionally rejects misleading push-event metadata such as `push.before == checked HEAD`. Temporary workflows that check out a different exact product SHA must isolate/unset GitHub event metadata before invoking the history-aware architecture gate. Do not weaken the inventory to accommodate a harness artifact.
- API/GITHUB_TOKEN-authored commits can yield `action_required` with no jobs. Same-tree natural verification commits were used where necessary; never claim a run passed unless jobs actually ran and completed successfully.
- Incidental formatting of legacy files outside the repo's formatter surface is not acceptable. Preserve clean diffs; if a validated commit contains accidental churn, correct it with an ordinary child commit rather than rewriting history.

## 7. End-of-session discipline

Before handing off again:

- keep the canonical progress ledger current at its top summary and detailed phase section;
- record exact base/head, PR, verification run, product tree if relevant, changed-file scope, rollback state, and remaining gate;
- add or update this current handoff and current next-agent prompt when context is about to be lost;
- keep temporary oracle/publisher branches out of product ancestry;
- leave draft/unmerged state explicit and do not imply Miguel authorized a merge unless he actually did.
'''
          Path('docs/internal/plans/NEXT_AGENT_HANDOFF_ARCHITECTURE_CONSOLIDATION_CURRENT.md').write_text(handoff)

          prompt = r'''Continue the Swift-Sim architecture consolidation from the current repository state.

