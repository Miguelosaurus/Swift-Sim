          Path('docs/internal/plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_CURRENT.md').write_text(prompt)
          PY
      - name: Validate exact handoff diff
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'docs/internal/README.md',
              'docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md',
              'docs/internal/plans/NEXT_AGENT_HANDOFF_ARCHITECTURE_CONSOLIDATION_CURRENT.md',
              'docs/internal/plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_CURRENT.md',
          }
          actual = set(subprocess.check_output(['git', 'status', '--short'], text=True).splitlines())
          paths = {line[3:] for line in actual}
          if paths != expected:
              raise SystemExit(f'Unexpected handoff paths: {sorted(paths)}')
          PY
          npm run check:docs
          env -u GITHUB_EVENT_NAME -u GITHUB_EVENT_PATH npm run check:architecture
      - name: Commit exact candidate tree
        shell: bash
        run: |
          git config user.name Miguel
          git config user.email serram1994@gmail.com
          git add docs/internal/README.md \
            docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md \
            docs/internal/plans/NEXT_AGENT_HANDOFF_ARCHITECTURE_CONSOLIDATION_CURRENT.md \
            docs/internal/plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_CURRENT.md
          git commit -m 'docs: hand off Phase 4 continuation'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort | tr '\n' ' ')" = "docs/internal/README.md docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md docs/internal/plans/NEXT_AGENT_HANDOFF_ARCHITECTURE_CONSOLIDATION_CURRENT.md docs/internal/plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_CURRENT.md "
      - name: Guard temporary output and publish candidate tree
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/$OUTPUT_BRANCH | cut -f1)" = "$BASE_SHA"
          git push origin HEAD:refs/heads/$OUTPUT_BRANCH
