name: Temporary artifact R2 regression format
on:
  push:
    branches:
      - agent/arch-ws-phase4-storage-maintenance-r2-regression
    paths:
      - .github/workflows/tmp-artifact-r2-regression-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arch-ws-phase4-storage-maintenance-r2-regression
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write test/deviceBuildArtifactMaintenanceService.test.ts
      - name: Focused compiled proof
        run: |
          npm run check:types
          npm run build
          node --test --test-concurrency=1 dist/test/deviceBuildArtifactMaintenanceService.test.js
          npx prettier --check test/deviceBuildArtifactMaintenanceService.test.ts package.json
          git diff --check
      - name: Publish and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/deviceBuildArtifactMaintenanceService.test.ts
          git rm .github/workflows/tmp-artifact-r2-regression-format.yml
          git commit -m "style: format artifact maintenance regression"
          git push origin HEAD:agent/arch-ws-phase4-storage-maintenance-r2-regression