name: Temporary Phase 3O Candidate Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/tmp-phase3o-shutdown-builder
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Validate exact Phase 3O candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='4463be4f9b18e7dd29e6ee019251980ffe583949'
          test "$(git hash-object mac-helper/bin/swift-sim-helper.js)" = '3d7fbe2fab24c05884c81122c57fe6a6ef5089c8'
          test "$(git ls-files -s mac-helper/bin/swift-sim-helper.js | awk '{print $1}')" = '100755'

          python3 - <<'PY'
          from pathlib import Path

          helper = Path('mac-helper/bin/swift-sim-helper.js')
          source = helper.read_text()

          old = 'import { createDeviceInstallationReconciliationCoordinator } from "../src/http/deviceInstallationReconciliationCoordinator.js";\n'
          new = old + 'import { createHelperShutdownCoordinator } from "../src/http/helperShutdownCoordinator.js";\n'
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          old = '  const activeSockets = new Set();\n'
          new = '\n'.join([
              '  let reconciliationTimer;',
              '  let deliveryCleanupTimer;',
              '  /** @type {ReturnType<typeof setInterval> | undefined} */',
              '  let keepAlive;',
          ]) + '\n'
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          start = source.index('  server.on("connection", (socket) => {')
          end = source.index('\n\n  await new Promise((resolve, reject) => {', start)
          replacement = '\n'.join([
              '  const shutdownCoordinator = createHelperShutdownCoordinator({',
              '    clearPeriodicWork: () => {',
              '      if (reconciliationTimer) clearInterval(reconciliationTimer);',
              '      if (deliveryCleanupTimer) clearInterval(deliveryCleanupTimer);',
              '      clearInterval(/** @type {ReturnType<typeof setInterval>} */ (keepAlive));',
              '    },',
              '    listBuildTasks: () => [...activeDeviceBuildTasks.values()],',
              '    cancelBuild: (build, message) => requestDeviceBuildCancellation(build, message),',
              '    closeIdleConnections: () => server.closeIdleConnections?.(),',
              '    closeServer: (onClosed) => server.close(onClosed),',
              '    closeAllConnections: () => server.closeAllConnections?.(),',
              '    listSessions: () => (typeof store.list === "function" ? store.list() : []),',
              '    stopSession,',
              '    exit: (code) => process.exit(code),',
              '    setTimeoutFn: (callback, delayMs) => setTimeout(callback, delayMs),',
              '  });',
              '  server.on("connection", (socket) => shutdownCoordinator.trackSocket(socket));',
          ])
          source = source[:start] + replacement + source[end:]

          old = '  let reconciliationTimer;\n  let deliveryCleanupTimer;\n  if (!deviceBuildsOnly) {'
          assert source.count(old) == 1
          source = source.replace(old, '  if (!deviceBuildsOnly) {', 1)

          old = '  const keepAlive = setInterval(() => {}, 60 * 60 * 1000);\n'
          assert source.count(old) == 1
          source = source.replace(old, '  keepAlive = setInterval(() => {}, 60 * 60 * 1000);\n', 1)

          start = source.index('  let shuttingDown = false;\n')
          end = source.index('  process.once("SIGTERM", shutdown);', start)
          source = source[:start] + '  const shutdown = () => shutdownCoordinator.shutdown();\n' + source[end:]
          helper.write_text(source)
          PY

          npm ci
          npx prettier --write \
            mac-helper/src/http/helperShutdownCoordinator.js \
            test/helperShutdownCoordinator.test.js
          node --test --test-concurrency=1 test/helperShutdownCoordinator.test.js
          npm run check

          rm .github/workflows/tmp-phase3o-validate.yml
          test "$(git hash-object mac-helper/bin/swift-sim-helper.js)" = '4cd8e9bfe5fa61a531329833038c08e9b617dd0b'
          test "$(git ls-files -s mac-helper/bin/swift-sim-helper.js | awk '{print $1}')" = '100755'
          git diff --check "$BASE_SHA" --
          ACTUAL=$(git diff --name-only "$BASE_SHA" -- | sort)
          EXPECTED=$(cat <<'EOF'
          mac-helper/bin/swift-sim-helper.js
          mac-helper/src/http/helperShutdownCoordinator.js
          test/helperShutdownCoordinator.test.js
          EOF
          )
          test "$ACTUAL" = "$EXPECTED"
          test "$(git diff --numstat "$BASE_SHA" -- mac-helper/bin/swift-sim-helper.js)" = $'23\t44\tmac-helper/bin/swift-sim-helper.js'

          echo "PHASE3O_HELPER_SHA=$(git hash-object mac-helper/bin/swift-sim-helper.js)"
          echo "PHASE3O_COORDINATOR_SHA=$(git hash-object mac-helper/src/http/helperShutdownCoordinator.js)"
          echo "PHASE3O_TEST_SHA=$(git hash-object test/helperShutdownCoordinator.test.js)"
          git diff --stat "$BASE_SHA" --
