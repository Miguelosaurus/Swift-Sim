name: Temporary Phase 4Z2 publisher

on:
  push:
    branches:
      - agent/architecture-consolidation-phase-4z2-wire-future-artifact-retention

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply staged product edits
        run: python3 scripts/tmp-phase4z2-publish.py
      - name: Format and focused validation
        run: |
          npx prettier --write mac-helper/src/deviceBuildArtifactRetentionCompatibility.js mac-helper/src/deviceBuildStore.js mac-helper/src/deviceBuildRuntimeController.js mac-helper/bin/swift-sim-helper.js test/deviceBuildStore.test.js test/deviceBuildRuntimeController.test.js
          node --test --test-concurrency=1 test/deviceBuildArtifactRetention.test.js test/deviceBuildStore.test.js test/deviceBuildRuntimeController.test.js
          npm run check:types
          npm run check:architecture
          git diff --check
      - name: Publish product commit
        run: |
          rm .github/workflows/tmp-phase4z2-publisher.yml scripts/tmp-phase4z2-publish.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mac-helper/src/deviceBuildArtifactRetentionCompatibility.js mac-helper/src/deviceBuildStore.js mac-helper/src/deviceBuildRuntimeController.js mac-helper/bin/swift-sim-helper.js test/deviceBuildStore.test.js test/deviceBuildRuntimeController.test.js .github/workflows/tmp-phase4z2-publisher.yml scripts/tmp-phase4z2-publish.py
          git commit -m 'feat: wire future device-build artifact retention'
          git push
