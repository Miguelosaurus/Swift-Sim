name: Temporary Current Architecture Handoff Publisher

on:
  push:
    branches:
      - agent/tmp-current-handoff-publisher
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BASE_SHA: 6ba637f968e424538b719081d7564f1690251df0
      TARGET_BRANCH: agent/architecture-consolidation-current-handoff
      STAGING_BRANCH: agent/tmp-current-handoff-publisher
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: 6ba637f968e424538b719081d7564f1690251df0
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Render canonical docs and handoff
        shell: bash
        run: |
          git fetch origin "$STAGING_BRANCH:refs/remotes/origin/$STAGING_BRANCH"
          git show "origin/$STAGING_BRANCH:docs/internal/plans/NEXT_AGENT_HANDOFF_ARCHITECTURE_CONSOLIDATION_CURRENT.md" > docs/internal/plans/NEXT_AGENT_HANDOFF_ARCHITECTURE_CONSOLIDATION_CURRENT.md
          git show "origin/$STAGING_BRANCH:docs/internal/plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_CURRENT.md" > docs/internal/plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_CURRENT.md
          git show "origin/$STAGING_BRANCH:.github/tmp/render_current_handoff.py" > /tmp/render_current_handoff.py
          python3 /tmp/render_current_handoff.py
      - name: Validate handoff candidate
        shell: bash
        run: |
          git diff --check
          npm run check:docs
          env -u GITHUB_EVENT_NAME -u GITHUB_EVENT_PATH npm run check:architecture
          python3 - <<'PY'
          import subprocess
          expected = {
              'docs/internal/README.md',
              'docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md',
              'docs/internal/plans/NEXT_AGENT_HANDOFF_ARCHITECTURE_CONSOLIDATION_CURRENT.md',
              'docs/internal/plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_CURRENT.md',
          }
          paths = {line[3:] for line in subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()}
          if paths != expected:
              raise SystemExit(f'unexpected candidate paths: {sorted(paths)}')
          PY
      - name: Commit exact four-file handoff
        shell: bash
        run: |
          git config user.name Miguel
          git config user.email serram1994@gmail.com
          git add docs/internal/README.md docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md docs/internal/plans/NEXT_AGENT_HANDOFF_ARCHITECTURE_CONSOLIDATION_CURRENT.md docs/internal/plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_CURRENT.md
          git commit -m 'docs: hand off current Phase 4 state'
          python3 - <<'PY'
          import subprocess
          expected = {
              'docs/internal/README.md',
              'docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md',
              'docs/internal/plans/NEXT_AGENT_HANDOFF_ARCHITECTURE_CONSOLIDATION_CURRENT.md',
              'docs/internal/plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_CURRENT.md',
          }
          actual = set(subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected committed paths: {sorted(actual)}')
          PY
      - name: Guard and publish docs-only handoff
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$BASE_SHA"
          git push origin HEAD:refs/heads/$TARGET_BRANCH
