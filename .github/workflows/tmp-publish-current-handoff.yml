name: Temporary Current Architecture Handoff Publisher

on:
  push:
    branches:
      - agent/tmp-current-handoff-publisher
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BASE_SHA: 6ba637f968e424538b719081d7564f1690251df0
      TARGET_BRANCH: agent/architecture-consolidation-current-handoff
      STAGING_BRANCH: agent/tmp-current-handoff-publisher
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: 6ba637f968e424538b719081d7564f1690251df0
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Render canonical docs and handoff
        shell: bash
        run: |
          git fetch origin "$STAGING_BRANCH:refs/remotes/origin/$STAGING_BRANCH"
          mkdir -p docs/internal/plans
          git show "origin/$STAGING_BRANCH:docs/internal/plans/NEXT_AGENT_HANDOFF_ARCHITECTURE_CONSOLIDATION_CURRENT.md" > docs/internal/plans/NEXT_AGENT_HANDOFF_ARCHITECTURE_CONSOLIDATION_CURRENT.md
          git show "origin/$STAGING_BRANCH:docs/internal/plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_CURRENT.md" > docs/internal/plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_CURRENT.md
          python3 - <<'PY'
          from pathlib import Path

          progress_path = Path('docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md')
          progress = progress_path.read_text()

          old_phase3 = "| 3 | Helper and HTTP decomposition | Partial implementation through corrective 3M; draft stack unmerged | [#34–#40, #56–#60, #63](https://github.com/Miguelosaurus/Swift-Sim/pull/63) | Phase 2 final metadata / `f21e344` | Corrective implementation `ba97946` | HTTP route families are extracted; lifecycle/reconciliation/process behavior, module-global runtime construction, and remaining CLI composition still prevent the Phase 3 gate |"
          new_phase3 = "| 3 | Helper and HTTP decomposition | **Implementation gate complete; draft stack unmerged** | [final corrective #93](https://github.com/Miguelosaurus/Swift-Sim/pull/93) | Phase 2 final metadata / `f21e344` | `07a8295` (tree `c025296`) | Hosted gate + exact-head closure audit passed; final Luna local/device evidence and Miguel merge authorization remain pending |"
          old_phase4 = "| 4 | Repository interfaces and SQLite migration | Pairing tranche implemented through E4; full phase incomplete and draft | [#41, #44–#50, #52–#54](https://github.com/Miguelosaurus/Swift-Sim/pull/54) | Phase 3G / `7367fa2` | Pairing rollback implementation `7ce31e6`; final E4 head `b1fac0d` | Non-pairing domain repositories, production composition, doctor/export, previous-release upgrade, and full cutover evidence remain required |"
          new_phase4 = "| 4 | Repository interfaces and SQLite migration | Pairing E4 + device-build 4F–4H hosted-green; 4I active/unvalidated at handoff | [#95–#99](https://github.com/Miguelosaurus/Swift-Sim/pull/99) | E4 already in Phase 3 ancestry; device-build continues from #94 | Last green product `6ba637f` (#98); 4I initial `954e5b9` failed format | Resolve live #99 first; then shadow observer, legacy lock identity, staged composition/cutover, session/other domains, diagnostics/export, previous-release upgrade, full gate |"
          if progress.count(old_phase3) != 1:
              raise SystemExit('stale Phase 3 summary row not found exactly once')
          if progress.count(old_phase4) != 1:
              raise SystemExit('stale Phase 4 summary row not found exactly once')
          progress = progress.replace(old_phase3, new_phase3).replace(old_phase4, new_phase4)

          old_header = "\n".join([
              "- Status: The pairing migration tranche through E4 plus the device-build 4F/4G repository and locked-source foundation are hosted-green in the draft stack; full Phase 4 is incomplete and all production cutover and rollback wiring remains disabled.",
              "- Full Phase 4 stack base: Phase 3G head `7367fa2574ff8fa88499be7c8b02ece72ff11ffa`.",
              "- Pairing E stack base: Phase 4D2 head `1364fa1ea570840e779b4f6b65195b3bb4433ac6`.",
              "- Validated E4 implementation: `7ce31e6f859180af213d7d3d52e2dd564bcbd63d`.",
              "- Active continuation head: PR #96 / `e8508440459d2f649432e4ce3c02ae84d1997b3a`, stacked from the hosted-green Phase 3 completion-ledger ancestry and retaining E4 as a direct ancestor.",
              "- Remaining Phase 4 finalization is required by the master plan. The local E5 label is not an optional waiver for unfinished domain repositories, composition, diagnostics, upgrade, or phase-gate evidence.",
          ])
          new_header = "\n".join([
              "- Status: Pairing through E4 plus device-build 4F–4H are hosted-green in the draft ancestry. Phase 4I is active but its initial handoff-time head is not validated; full Phase 4 remains incomplete and production cutover/rollback stays disabled.",
              "- Historical Phase 4 stack base: Phase 3G head `7367fa2574ff8fa88499be7c8b02ece72ff11ffa`; E4 final docs `b1fac0df3360fdc68ca76d910e467b8a1f4944d7` is already a direct ancestor of final Phase 3, so no replay/rebase is needed.",
              "- Pairing E stack base: Phase 4D2 head `1364fa1ea570840e779b4f6b65195b3bb4433ac6`.",
              "- Last fully hosted-green product continuation at handoff: PR #98 / `6ba637f968e424538b719081d7564f1690251df0`, product tree `d6c27ef13e221492d606ad53bc8fd91ab63d7b7f`, Verify #875 / run `31484093720`.",
              "- Active candidate: PR #99 / `agent/architecture-consolidation-phase-4i-device-build-shadow-comparison`. Initial head `954e5b98b040d290c60f509e1c5e82d92edbc999` failed Verify #876 only at Prettier and must not be used as a validated base. Resolve the PR's live head and latest Verify before any new write.",
              "- Remaining Phase 4 finalization is required by the master plan. Production SQLite authority, rollback, and Phase 5 preload removal remain unauthorized.",
          ])
          if progress.count(old_header) != 1:
              raise SystemExit('Phase 4 current header not found exactly once')
          progress = progress.replace(old_header, new_header)

          g_row = "| 4G — locked device-build legacy snapshot | [#96](https://github.com/Miguelosaurus/Swift-Sim/pull/96) | #95 / `bc55ccd` | `e850844` | `31481810512` passed | Open, draft, unmerged |"
          h_i_rows = "\n".join([
              g_row,
              "| 4FG — device-build migration ledger | [#97](https://github.com/Miguelosaurus/Swift-Sim/pull/97) | #96 / `e850844` | docs `026672a` | `31482632870` passed | Open, draft, unmerged |",
              "| 4H — resumable device-build legacy import | [#98](https://github.com/Miguelosaurus/Swift-Sim/pull/98) | #97 / `026672a` | `6ba637f` | `31484093720` passed | Open, draft, unmerged |",
              "| 4I — device-build shadow comparison | [#99](https://github.com/Miguelosaurus/Swift-Sim/pull/99) | #98 / `6ba637f` | initial `954e5b9` — **not validated** | `31501261237` failed at Prettier | Open, draft; resolve live head before stacking |",
          ])
          if progress.count(g_row) != 1:
              raise SystemExit('4G table row not found exactly once')
          progress = progress.replace(g_row, h_i_rows)

          old_residual = "The E4 pairing rollback slice has no remaining finding from its focused audit. Phase 4F and 4G now cover the first non-pairing transactional domain boundary for device-build state, but full Phase 4 remains incomplete: device-build import/checkpoint/shadow comparison and authority composition, a production-compatible legacy build-lock identity provider, session-domain repositories/migration, schema/migration/permission/orphan diagnostics, redacted export, corruption guidance, previous-tag upgrade proof, and full cutover/rollback evidence are still required. Production rollback/cutover remains unauthorized, and final persistent-local/device evidence and Miguel merge authorization remain pending."
          new_residual = "The E4 pairing rollback slice has no remaining finding from its focused audit. Device-build 4F–4H now provide the typed SQLite repository, locked read-only legacy snapshot, and resumable import/checkpoint path without changing production authority. Phase 4I is the active shadow-comparison slice; its initial `954e5b9` head is not validated because Verify #876 stopped at Prettier, so its live head must be re-resolved before stacking. Full Phase 4 still requires device-build shadow observation/evidence, a production-compatible legacy build-lock identity provider, staged composition and fenced cutover/rollback, session/other transactional-domain repositories and migration, schema/migration/permission/orphan diagnostics, redacted export/corruption guidance, previous-tag upgrade proof, and the full phase gate. Production rollback/cutover remains unauthorized, and final persistent-local/device evidence plus Miguel merge authorization remain pending."
          if progress.count(old_residual) != 1:
              raise SystemExit('Phase 4 residual paragraph not found exactly once')
          progress = progress.replace(old_residual, new_residual)

          insertion_marker = "## Cross-phase reliability correction — helper state growth"
          current_note = """### Phase 4H — resumable device-build legacy import

- PR #98 / `6ba637f968e424538b719081d7564f1690251df0` (tree `d6c27ef13e221492d606ad53bc8fd91ab63d7b7f`) adds the locked `DeviceBuildLegacyImportCoordinator`/applier on top of the 4F repository and 4G source snapshot boundary.
- The import model intentionally mirrors the validated pairing recovery protocol rather than pretending nested SQLite transactions are available: the whole device-build domain replacement commits atomically, checkpoint evidence commits separately, and retry repairs checkpoint-only state without replaying an already matching domain replacement.
- Oracle/hardening runs `31483313710` and `31483641481` passed the focused, architecture, strict-type, and full Node/package gates. Authoritative natural Verify #875 / run `31484093720` passed full Node/package, isolated clean Homebrew, YAML/shell, and iOS gates.
- Production startup does not invoke the importer; JSON remains the sole production authority. Live composition still requires exact compatibility with the legacy build-lock `startedAt` identity representation.

### Phase 4I — active shadow-comparison candidate at handoff

- PR #99 was opened from exact green Phase 4H to add whole-snapshot device-build comparison plus redacted SQLite mismatch evidence.
- At handoff time its initial implementation head was `954e5b98b040d290c60f509e1c5e82d92edbc999`. Verify #876 / run `31501261237` passed syntax, architecture, docs, and strict TypeScript, then failed because Prettier rejected `test/deviceBuildShadowComparison.test.ts`; later Homebrew/iOS gates therefore did not run.
- `954e5b9` is **not** a validated continuation base. The next agent must resolve PR #99's live head and latest Verify first. If a later corrective head is fully hosted-green, continue from it; otherwise fix/coordinate the existing PR instead of creating a sibling implementation.
- Even a green comparator does not authorize SQLite authority. The next device-build stage is best-effort shadow observation at an existing authoritative JSON read seam, followed separately by exact legacy lock-identity composition and real shadow evidence before any cutover design.

"""
          if insertion_marker not in progress:
              raise SystemExit('cross-phase marker not found')
          if '### Phase 4H — resumable device-build legacy import' not in progress:
              progress = progress.replace(insertion_marker, current_note + insertion_marker)

          progress_path.write_text(progress)

          readme_path = Path('docs/internal/README.md')
          readme = readme_path.read_text()
          old_link = "- [Next Agent Prompt — Phase 0](plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_PHASE0.md)"
          new_links = "\n".join([
              "- [Current Architecture Handoff](plans/NEXT_AGENT_HANDOFF_ARCHITECTURE_CONSOLIDATION_CURRENT.md)",
              "- [Current Next-Agent Prompt](plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_CURRENT.md)",
              "- [Historical Phase 0 Next-Agent Prompt](plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_PHASE0.md)",
          ])
          if readme.count(old_link) != 1:
              raise SystemExit('old Phase 0 navigation link not found exactly once')
          readme_path.write_text(readme.replace(old_link, new_links))
          PY
      - name: Validate handoff candidate
        shell: bash
        run: |
          git diff --check
          npm run check:docs
          env -u GITHUB_EVENT_NAME -u GITHUB_EVENT_PATH npm run check:architecture
          python3 - <<'PY'
          import subprocess
          expected = {
              'docs/internal/README.md',
              'docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md',
              'docs/internal/plans/NEXT_AGENT_HANDOFF_ARCHITECTURE_CONSOLIDATION_CURRENT.md',
              'docs/internal/plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_CURRENT.md',
          }
          paths = {line[3:] for line in subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()}
          if paths != expected:
              raise SystemExit(f'unexpected candidate paths: {sorted(paths)}')
          PY
      - name: Commit exact four-file handoff
        shell: bash
        run: |
          git config user.name Miguel
          git config user.email serram1994@gmail.com
          git add docs/internal/README.md docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md docs/internal/plans/NEXT_AGENT_HANDOFF_ARCHITECTURE_CONSOLIDATION_CURRENT.md docs/internal/plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_CURRENT.md
          git commit -m 'docs: hand off current Phase 4 state'
          python3 - <<'PY'
          import subprocess
          expected = {
              'docs/internal/README.md',
              'docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md',
              'docs/internal/plans/NEXT_AGENT_HANDOFF_ARCHITECTURE_CONSOLIDATION_CURRENT.md',
              'docs/internal/plans/NEXT_AGENT_PROMPT_ARCHITECTURE_CONSOLIDATION_CURRENT.md',
          }
          actual = set(subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected committed paths: {sorted(actual)}')
          PY
      - name: Guard and publish docs-only handoff
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$BASE_SHA"
          git push origin HEAD:refs/heads/$TARGET_BRANCH
