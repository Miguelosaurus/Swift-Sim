name: Round 5 Ref Export

on:
  push:
    branches:
      - agent/round5-export-ref

permissions:
  contents: read
  pull-requests: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Package exact checkout
        run: tar --exclude=.git -czf swift-sim-round5.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: swift-sim-round5-ref
          path: swift-sim-round5.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Publish run ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 2 --repo "$GITHUB_REPOSITORY" --body "Round 5 ref export workflow run: $GITHUB_RUN_ID"
