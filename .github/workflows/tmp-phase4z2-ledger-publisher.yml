name: Temporary Phase 4Z2 ledger publisher

on:
  push:
    branches:
      - agent/architecture-consolidation-phase-4z2-local-verification-handoff

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Update Phase 4 program row
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md')
          text = path.read_text()
          old = '| 4 | Repository interfaces and SQLite migration | Pairing tranche implemented through E4; full phase incomplete and draft | [#41, #44–#50, #52–#54](https://github.com/Miguelosaurus/Swift-Sim/pull/54) | Phase 3G / `7367fa2` | Pairing rollback implementation `7ce31e6`; final E4 head `b1fac0d` | Non-pairing domain repositories, production composition, doctor/export, previous-release upgrade, and full cutover evidence remain required |'
          new = '| 4 | Repository interfaces and SQLite migration | Pairing rollback plus device-build live JSON-authoritative SQLite shadow and future artifact retention through 4Z2 hosted-green; full phase incomplete and draft | [#41, #44–#50, #52–#54, #95–#120](https://github.com/Miguelosaurus/Swift-Sim/pull/120) | Phase 3G / `7367fa2` | Device-build retention head `19547d5`; pairing E4 remains direct ancestor | Real 212-record import rerun, historical artifact dry-run/reconciliation, device-build cutover/rollback/export, sessions/remaining domains, doctor/export/corruption, previous-release upgrade, and final Phase 4 gate remain required |'
          if text.count(old) != 1:
              raise SystemExit(f'Phase 4 ledger row count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate documentation metadata
        run: |
          npm run check:docs
          npm run check:architecture
          git diff --check
      - name: Publish ledger update
        run: |
          rm .github/workflows/tmp-phase4z2-ledger-publisher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md .github/workflows/tmp-phase4z2-ledger-publisher.yml
          git commit -m 'docs: update Phase 4 progress through 4Z2'
          git push
