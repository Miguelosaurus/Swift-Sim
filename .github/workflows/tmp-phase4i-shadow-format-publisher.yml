name: Temporary Phase 4I Shadow Format Publisher

on:
  push:
    branches:
      - agent/tmp-phase4i-shadow-format-publisher

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: d099acca94a3c9de79b4f13cbc0c31c178d20a1a
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Publish exact formatted file to temporary output branch
        shell: bash
        run: |
          npx prettier --write mac-helper/src/persistence/deviceBuildShadowComparison.js
          git config user.name "swift-sim-phase4i-oracle"
          git config user.email "actions@users.noreply.github.com"
          git add mac-helper/src/persistence/deviceBuildShadowComparison.js
          git commit -m "Format Phase 4I shadow comparator"
          git push origin HEAD:refs/heads/agent/tmp-phase4i-shadow-formatted-output
