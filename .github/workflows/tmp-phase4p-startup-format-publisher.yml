name: Temporary Phase 4P Startup Format Publisher

on:
  push:
    branches:
      - agent/tmp-phase4p-startup-format-publisher

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 13d99ef674c1221cf4abd36d26fdac0f01d4efab
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Publish exact formatted startup module
        shell: bash
        run: |
          npx prettier --write mac-helper/src/persistence/deviceBuildShadowStartup.js
          git config user.name "swift-sim-phase4p-oracle"
          git config user.email "actions@users.noreply.github.com"
          git add mac-helper/src/persistence/deviceBuildShadowStartup.js
          git commit -m "Format Phase 4P shadow startup"
          git push origin HEAD:refs/heads/agent/tmp-phase4p-startup-formatted-output
