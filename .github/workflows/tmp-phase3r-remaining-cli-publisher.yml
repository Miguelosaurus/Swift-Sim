name: Temporary Phase 3R Remaining CLI Publisher

on:
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Reuse corrected Phase 3R publisher script
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE3Q_VERIFY_RUN: "31428503149"
          DELETE_APP_VERIFY_RUN: "31428505506"
          BASE: d28ba88be0e4cef30588f7764b7997d391b62aea
          DELETE_APP_HEAD: ad9dd22721b0f5f99143d1f47fc8d02ff42cd7ce
          PRODUCT_BRANCH: agent/architecture-consolidation-phase-3r-remaining-cli-parser
        run: |
          set -euo pipefail
          git show 4e264d33c8226a3b4d8c6def80c8ae02bb29f278:.github/workflows/tmp-phase3r-remaining-cli-publisher.yml > /tmp/original.yml
          python3 <<'PY'
          from pathlib import Path

          workflow = Path("/tmp/original.yml").read_text()
          marker = "        run: |\n"
          if workflow.count(marker) != 1:
              raise SystemExit("expected one publisher run block")
          block = workflow.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              if line.startswith("          "):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          script = "\n".join(lines) + "\n"

          replacements = {
              'calls.push(["start-session", input]);': 'calls.push(["start-session", { ...(input as Record<string, unknown>) }]);',
              'calls.push(["build-device", input]);': 'calls.push(["build-device", { ...(input as Record<string, unknown>) }]);',
              'import { parseArgs } from "node:util";\n\nconst COMMANDS': 'import { parseArgs } from "node:util";\n\n/** @typedef {{ type: "string" | "boolean", short?: string, multiple?: boolean }} CompatibilityParseOption */\n\nconst COMMANDS',
              'function sessionOptions() {': '/** @returns {Record<string, CompatibilityParseOption>} */\nfunction sessionOptions() {',
              'function deviceBuildOptions() {': '/** @returns {Record<string, CompatibilityParseOption>} */\nfunction deviceBuildOptions() {',
          }
          for old, new in replacements.items():
              if script.count(old) != 1:
                  raise SystemExit(f"typing/normalization sentinel missing: {old}")
              script = script.replace(old, new, 1)

          optional_replacements = [
              ('sessionId?: string', 'sessionId?: string | undefined', 2),
              ('token?: string', 'token?: string | undefined', 2),
              ('remoteBaseUrl?: string', 'remoteBaseUrl?: string | undefined', 1),
          ]
          for old, new, expected_count in optional_replacements:
              actual = script.count(old)
              if actual != expected_count:
                  raise SystemExit(f"optional type sentinel count for {old}: expected {expected_count}, got {actual}")
              script = script.replace(old, new)

          Path("/tmp/publish.sh").write_text(script)
          PY
          bash /tmp/publish.sh
