name: Temporary Phase 4Z1 type fix

on:
  push:
    branches:
      - agent/architecture-consolidation-phase-4z1-artifact-retention-policy

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Fix strict JSDoc return type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mac-helper/src/deviceBuildArtifactRetention.js')
          text = path.read_text()
          old = '/** @param {unknown[]} values */\nfunction uniqueStrings(values) {'
          new = '/** @param {unknown[]} values @returns {string[]} */\nfunction uniqueStrings(values) {'
          if text.count(old) != 1:
              raise SystemExit(f'uniqueStrings marker count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Focused validation
        run: |
          npx prettier --write mac-helper/src/deviceBuildArtifactRetention.js test/deviceBuildArtifactRetention.test.js
          node --test test/deviceBuildArtifactRetention.test.js
          npm run check:types
          npm run check:architecture
          git diff --check
      - name: Publish correction
        run: |
          rm .github/workflows/tmp-phase4z1-type-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mac-helper/src/deviceBuildArtifactRetention.js test/deviceBuildArtifactRetention.test.js .github/workflows/tmp-phase4z1-type-fix.yml
          git commit -m 'fix: type artifact retention candidates'
          git push
