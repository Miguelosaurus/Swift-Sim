name: Temporary Phase 4X publisher

on:
  push:
    branches:
      - agent/architecture-consolidation-phase-4x-homebrew-lsof-resolution

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Homebrew verifier resolve lsof robustly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-homebrew-package.sh')
          text = path.read_text()
          old = '''service_with_state services start "$TAP/$TEST_FORMULA" >/dev/null
          listener_pid() {
            lsof -nP -iTCP:"$PORT" -sTCP:LISTEN -t | head -n 1
          }
          '''
          new = '''service_with_state services start "$TAP/$TEST_FORMULA" >/dev/null
          LSOF_BIN="$(command -v lsof || true)"
          if [[ -z "$LSOF_BIN" && -x /usr/sbin/lsof ]]; then
            LSOF_BIN=/usr/sbin/lsof
          fi
          if [[ -z "$LSOF_BIN" ]]; then
            echo "Homebrew verification requires lsof to identify the helper listener." >&2
            exit 1
          fi
          listener_pid() {
            "$LSOF_BIN" -nP -iTCP:"$PORT" -sTCP:LISTEN -t | head -n 1
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'lsof listener block count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate script structure and fallback contract
        run: |
          bash -n scripts/verify-homebrew-package.sh
          python3 - <<'PY'
          from pathlib import Path
          text = Path('scripts/verify-homebrew-package.sh').read_text()
          required = [
              'LSOF_BIN="$(command -v lsof || true)"',
              '[[ -z "$LSOF_BIN" && -x /usr/sbin/lsof ]]',
              'LSOF_BIN=/usr/sbin/lsof',
              '"$LSOF_BIN" -nP -iTCP:"$PORT" -sTCP:LISTEN -t',
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'missing lsof fallback contract: {item}')
          PY
          git diff --check
      - name: Publish product commit
        run: |
          rm .github/workflows/tmp-phase4x-publisher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-homebrew-package.sh .github/workflows/tmp-phase4x-publisher.yml
          git commit -m 'fix: resolve lsof for Homebrew verification'
          git push
