name: Temporary Phase 4Y publisher

on:
  push:
    branches:
      - agent/architecture-consolidation-phase-4y-historical-signing-style

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Add historical signing-style upgrade
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('mac-helper/src/persistence/deviceBuildLockedLegacySnapshot.js')
          text = source.read_text()
          old = '    signing.deviceInstallable = false;\n  }\n  return build;'
          new = '    signing.deviceInstallable = false;\n  }\n  if (signing && !Object.prototype.hasOwnProperty.call(signing, "style")) {\n    signing.style = "";\n  }\n  return build;'
          if text.count(old) != 1:
              raise SystemExit(f'signing upgrade marker count={text.count(old)}')
          source.write_text(text.replace(old, new, 1))

          test = Path('test/deviceBuildLegacyCompatibility.test.js')
          text = test.read_text()
          old = '  delete build.delivery;\n  delete build.signing.deviceInstallable;\n\n  const parsed = parseDeviceBuildLegacySnapshot(legacyState(build));'
          new = '  delete build.delivery;\n  delete build.signing.deviceInstallable;\n  delete build.signing.style;\n\n  const parsed = parseDeviceBuildLegacySnapshot(legacyState(build));'
          if text.count(old) != 1:
              raise SystemExit(f'historical omission marker count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '  assert.equal(imported.signing.deviceInstallable, false);\n});'
          new = '  assert.equal(imported.signing.deviceInstallable, false);\n  assert.equal(imported.signing.style, "");\n});'
          if text.count(old) != 1:
              raise SystemExit(f'historical style assertion marker count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '  assert.deepEqual(imported.delivery, build.delivery);\n  assert.equal(imported.signing.deviceInstallable, true);\n});'
          new = '  assert.deepEqual(imported.delivery, build.delivery);\n  assert.equal(imported.signing.deviceInstallable, true);\n  assert.equal(imported.signing.style, "automatic");\n});'
          if text.count(old) != 1:
              raise SystemExit(f'explicit style preservation marker count={text.count(old)}')
          text = text.replace(old, new, 1)

          marker = 'test("legacy snapshot does not invent a missing signing object", () => {'
          inserted = '''test("legacy snapshot does not repair a malformed present signing style", () => {
            const build = legacyBuild();
            build.signing.style = null;

            assert.throws(
              () => parseDeviceBuildLegacySnapshot(legacyState(build)),
              /Device build record is invalid\\./,
            );
          });

          test("legacy snapshot does not invent a missing signing object", () => {'''
          if text.count(marker) != 1:
              raise SystemExit(f'malformed style test marker count={text.count(marker)}')
          test.write_text(text.replace(marker, inserted, 1))
          PY
      - name: Format and focused validation
        run: |
          npx prettier --write mac-helper/src/persistence/deviceBuildLockedLegacySnapshot.js test/deviceBuildLegacyCompatibility.test.js
          node --test test/deviceBuildLegacyCompatibility.test.js
          npm run check:types
          npm run check:architecture
          git diff --check
      - name: Publish product commit
        run: |
          rm .github/workflows/tmp-phase4y-publisher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mac-helper/src/persistence/deviceBuildLockedLegacySnapshot.js test/deviceBuildLegacyCompatibility.test.js .github/workflows/tmp-phase4y-publisher.yml
          git commit -m 'fix: upgrade historical missing signing style'
          git push
