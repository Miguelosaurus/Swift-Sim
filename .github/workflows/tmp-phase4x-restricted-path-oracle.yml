name: Temporary Phase 4X restricted PATH oracle

on:
  push:
    branches:
      - agent/tmp-phase4x-restricted-path-homebrew-oracle

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run clean Homebrew gate without usr sbin in PATH
        shell: bash
        run: |
          set -euo pipefail
          NODE_BIN="$(dirname "$(command -v node)")"
          BREW_BIN="$(dirname "$(command -v brew)")"
          NPM_BIN="$(command -v npm)"
          RESTRICTED_PATH="$NODE_BIN:$BREW_BIN:/usr/bin:/bin"
          [[ ":$RESTRICTED_PATH:" != *":/usr/sbin:"* ]]
          [[ -x /usr/sbin/lsof ]]
          SWIFT_SIM_RUN_CLEAN_HOMEBREW=1 PATH="$RESTRICTED_PATH" "$NPM_BIN" run check:package
