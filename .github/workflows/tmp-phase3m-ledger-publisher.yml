name: Temporary Phase 3M Ledger Publisher

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Patch and validate canonical ledger
        env:
          EXPECTED_BASE: ba97946b7ea9cd4c75e2b98fb905722a9db6e083
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXPECTED_BASE")" = "$EXPECTED_BASE"
          node scripts/tmp-phase3m-ledger-publisher.mjs
          npm ci
          npm run check:docs
          git diff --check
      - name: Publish metadata-only product commit
        env:
          EXPECTED_BASE: ba97946b7ea9cd4c75e2b98fb905722a9db6e083
          PRODUCT_BRANCH: agent/architecture-consolidation-phase-3m-pairing-page-route
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LEDGER="$PWD/docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md"
          git worktree add /tmp/product "$EXPECTED_BASE"
          cp "$LEDGER" /tmp/product/docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md
          cd /tmp/product
          test "$(git diff --name-only)" = "docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md
          git commit -m "docs: record Phase 3L and 3M evidence"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${PRODUCT_BRANCH}"
          echo "Published metadata head $(git rev-parse HEAD)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase3m-final-source
          path: |
            /tmp/product/mac-helper/bin/swift-sim-helper.js
            /tmp/product/docs/internal/plans/ARCHITECTURE_CONSOLIDATION_PROGRESS.md
          if-no-files-found: error
          retention-days: 1
