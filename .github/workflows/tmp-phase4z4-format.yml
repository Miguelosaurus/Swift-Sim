name: Temporary Phase 4Z4 formatter

on:
  push:
    branches:
      - agent/architecture-consolidation-phase-4z4-readonly-artifact-measurement

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format only the new measurement adapter
        run: npx prettier --write mac-helper/src/infrastructure/nodeDeviceBuildArtifactUsage.js
      - name: Guard formatter scope and validate focused slice
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "mac-helper/src/infrastructure/nodeDeviceBuildArtifactUsage.js" ]; then
            echo "Unexpected formatter diff:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          npx prettier --check mac-helper/src/infrastructure/nodeDeviceBuildArtifactUsage.js
          npm run check:types
          node --test test/deviceBuildArtifactAuditPlan.test.js test/deviceBuildArtifactAuditMeasurement.test.js
          npm run check:architecture
          git diff --check
      - name: Publish formatted product tree and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mac-helper/src/infrastructure/nodeDeviceBuildArtifactUsage.js
          git rm .github/workflows/tmp-phase4z4-format.yml
          git commit -m "chore: format Phase 4Z4 measurement adapter"
          git push origin HEAD:agent/architecture-consolidation-phase-4z4-readonly-artifact-measurement
