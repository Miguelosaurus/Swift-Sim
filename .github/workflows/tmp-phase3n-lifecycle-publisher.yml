name: Temporary Phase 3N Lifecycle Publisher

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Build and validate Phase 3N product tree
        env:
          EXPECTED_BASE: 1a05b2e44cc1064e862a5922605cfb3b2ad63489
          EXPECTED_HELPER_BLOB: 677e175c41f46c4c6c97af8ccf0a37d4d22792fb
        run: |
          set -euo pipefail
          git worktree add /tmp/product "$EXPECTED_BASE"
          test "$(git -C /tmp/product hash-object mac-helper/bin/swift-sim-helper.js)" = "$EXPECTED_HELPER_BLOB"
          mkdir -p /tmp/product/mac-helper/src/http /tmp/product/test
          cp mac-helper/src/http/helperServiceLifecycle.js /tmp/product/mac-helper/src/http/helperServiceLifecycle.js
          cp test/helperServiceLifecycle.test.js /tmp/product/test/helperServiceLifecycle.test.js
          node scripts/tmp-phase3n-publisher.mjs /tmp/product
          cd /tmp/product
          npm ci
          npx prettier --write mac-helper/src/http/helperServiceLifecycle.js
          git diff --check
          printf '%s\n' \
            mac-helper/bin/swift-sim-helper.js \
            mac-helper/src/http/helperServiceLifecycle.js \
            test/helperServiceLifecycle.test.js > /tmp/expected-files
          test "$(wc -l < mac-helper/bin/swift-sim-helper.js | tr -d ' ')" -lt 1706
          grep -q 'createHelperServiceLifecycle' mac-helper/bin/swift-sim-helper.js
          ! grep -q 'server.on("connection", (socket)' mac-helper/bin/swift-sim-helper.js
          git add mac-helper/bin/swift-sim-helper.js mac-helper/src/http/helperServiceLifecycle.js test/helperServiceLifecycle.test.js
          git diff --cached --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: extract helper service lifecycle"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          git diff HEAD^ HEAD --check
          git diff --name-only HEAD^ HEAD | sort > /tmp/actual-commit-files
          diff -u /tmp/expected-files /tmp/actual-commit-files
          npm run check:source
          npm run check:types
          npm run check:format
          npm run check:lint
          node --test --test-concurrency=1 test/helperServiceLifecycle.test.js
      - name: Publish atomic Phase 3N implementation
        env:
          EXPECTED_BASE: 1a05b2e44cc1064e862a5922605cfb3b2ad63489
          PRODUCT_BRANCH: agent/architecture-consolidation-phase-3n-helper-service-lifecycle
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/product
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${PRODUCT_BRANCH}"
          echo "Published implementation head $(git rev-parse HEAD)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase3n-product-source
          path: |
            /tmp/product/mac-helper/bin/swift-sim-helper.js
            /tmp/product/mac-helper/src/http/helperServiceLifecycle.js
            /tmp/product/test/helperServiceLifecycle.test.js
          if-no-files-found: error
          retention-days: 1
