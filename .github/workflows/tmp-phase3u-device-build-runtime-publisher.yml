name: Temporary Phase 3U Device Build Runtime Publisher

on:
  push:
    branches:
      - agent/tmp-phase3u-device-build-runtime-oracle
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-phase3u-device-build-runtime-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      BASE_SHA: 2b870d1cd6f76f1b822802219d52b7780bd77e3d
      PRODUCT_BRANCH: agent/architecture-consolidation-phase-3u-device-build-runtime
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: 2b870d1cd6f76f1b822802219d52b7780bd77e3d
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact validated Phase 3U candidate
        shell: bash
        run: |
          set -euo pipefail
          git show origin/agent/tmp-phase3u-device-build-runtime-oracle:.github/tmp/phase3u-device-build-runtime.py > /tmp/phase3u.py
          git show origin/agent/tmp-phase3u-device-build-runtime-oracle:.github/tmp/phase3u-device-build-runtime-typefix.py > /tmp/phase3u-typefix.py
          python3 /tmp/phase3u.py
          python3 /tmp/phase3u-typefix.py
          npx prettier --write mac-helper/src/deviceBuildRuntimeController.js
      - name: Focused build-runtime and composition tests
        run: >-
          node --test
          test/deviceBuildRuntimeController.test.js
          test/compatibilityHelperRuntime.test.js
          test/compatibilityHelperImport.test.js
          test/deviceBuildCommandApplicationService.test.js
          test/deviceAppApplicationService.test.js
      - name: Strict type gate
        run: npm run check:types
      - name: Commit exact six-file product candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Miguel"
          git config user.email "serram1994@gmail.com"
          git add \
            mac-helper/bin/swift-sim-helper.js \
            mac-helper/src/deviceBuildRuntimeController.js \
            mac-helper/src/infrastructure/compatibilityHelperRuntime.js \
            package.json \
            test/compatibilityHelperRuntime.test.js \
            test/deviceBuildRuntimeController.test.js
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "6"
          git commit -m "Phase 3U: extract device build runtime"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
      - name: Full Node/package gate
        shell: bash
        run: env -u GITHUB_EVENT_PATH -u GITHUB_EVENT_NAME npm run check
      - run: git diff --check
      - name: Guard and publish exact fast-forward product commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          CURRENT=$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)
          if [[ "$CURRENT" != "$BASE_SHA" ]]; then
            echo "Product ref moved: expected $BASE_SHA, found $CURRENT" >&2
            exit 1
          fi
          CURRENT=$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)
          if [[ "$CURRENT" != "$BASE_SHA" ]]; then
            echo "Product ref moved before publication: expected $BASE_SHA, found $CURRENT" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
