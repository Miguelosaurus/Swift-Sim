name: Temporary Phase 3S Session Runtime Publisher

on:
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Run corrected Phase 3S publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_VERIFY_RUN: "31430219744"
          BASE: b994cfa3d5a4f4a8aa5fe0aa8760a943745b2cb1
          SOURCE_BRANCH: agent/architecture-consolidation-phase-3r-remaining-cli-parser
          PRODUCT_BRANCH: agent/architecture-consolidation-phase-3s-session-runtime-controller
        run: |
          set -euo pipefail
          git show ff551d4a171aacdb62248ab046b3d384a94e0317:.github/workflows/tmp-phase3s-session-runtime-publisher.yml > /tmp/original.yml
          python3 <<'PY'
          from pathlib import Path

          workflow = Path("/tmp/original.yml").read_text()
          marker = "        run: |\n"
          if workflow.count(marker) != 1:
              raise SystemExit("expected one original publisher run block")
          block = workflow.split(marker, 1)[1]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          ) + "\n"

          replacements = {
              'block_start = helper.find("async function fetchWithTimeout(url, timeoutMs) {\\n")\nblock_end = helper.find("async function createDeviceBuild(values) {\\n", block_start)': 'fetch_start = helper.find("async function fetchWithTimeout(url, timeoutMs) {\\n")\nblock_start = helper.find("async function proxyStream(res, session) {\\n", fetch_start)\nblock_end = helper.find("async function createDeviceBuild(values) {\\n", block_start)',
              'if block_start < 0 or block_end < 0:\n    raise SystemExit("session runtime block sentinels missing")\nsession_block = helper[block_start:block_end].rstrip() + "\\n"': 'if fetch_start < 0 or block_start < 0 or block_end < 0:\n    raise SystemExit("session runtime block sentinels missing")\nfetch_block = helper[fetch_start:block_start].rstrip() + "\\n\\n"\nsession_block = helper[block_start:block_end].rstrip() + "\\n"',
              'module += indent(session_block, "  ")': 'module += indent(fetch_block + session_block, "  ")',
              'helper = helper[:block_start] + helper[block_end:]': 'remove_start = helper.find("async function proxyStream(res, session) {\\n")\nremove_end = helper.find("async function createDeviceBuild(values) {\\n", remove_start)\nif remove_start < 0 or remove_end < 0:\n    raise SystemExit("updated session removal sentinels missing")\nhelper = helper[:remove_start] + helper[remove_end:]',
          }
          for old, new in replacements.items():
              if script.count(old) != 1:
                  raise SystemExit(f"Phase 3S correction sentinel missing: {old}")
              script = script.replace(old, new, 1)

          write_anchor = "helper_path.write_text(helper)\n"
          cleanup_code = '''helper_path.write_text(helper)

round2_path = Path("test/confirmationRound2State.test.js")
round2 = round2_path.read_text()
old_import = 'import { mkdtempSync, readFileSync, rmSync, writeFileSync } from "node:fs";\\n'
new_import = 'import { mkdtempSync, rmSync, writeFileSync } from "node:fs";\\n'
if round2.count(old_import) != 1:
    raise SystemExit("confirmationRound2State readFileSync import sentinel missing")
round2 = round2.replace(old_import, new_import, 1)
legacy_marker = 'test("helper source persists failed starts and uses shared automatic transport matching", () => {'
legacy_start = round2.find(legacy_marker)
if legacy_start < 0:
    raise SystemExit("legacy session source-text test sentinel missing")
round2_path.write_text(round2[:legacy_start].rstrip() + "\\n")

baseline_path = Path("scripts/architecture/baseline-policy.json")
baseline = baseline_path.read_text()
baseline_entry = '      "test/confirmationRound2State.test.js": 1,\\n'
if baseline.count(baseline_entry) != 1:
    raise SystemExit("session source-text debt cap sentinel missing")
baseline_path.write_text(baseline.replace(baseline_entry, "", 1))

package_path = Path("package.json")
package = package_path.read_text()
format_anchor = 'mac-helper/src/helperCliRuntime.js mac-helper/src/helperEntrypoint.js \\"test/**/*.ts\\"'
format_replacement = 'mac-helper/src/helperCliRuntime.js mac-helper/src/helperEntrypoint.js mac-helper/src/sessionRuntimeController.js \\"test/**/*.ts\\"'
if package.count(format_anchor) != 1:
    raise SystemExit("package format coverage sentinel missing")
package = package.replace(format_anchor, format_replacement, 1)
lint_anchor = 'mac-helper/src/helperCliRuntime.js mac-helper/src/helperEntrypoint.js test --ext .js,.ts'
lint_replacement = 'mac-helper/src/helperCliRuntime.js mac-helper/src/helperEntrypoint.js mac-helper/src/sessionRuntimeController.js test --ext .js,.ts'
if package.count(lint_anchor) != 1:
    raise SystemExit("package lint coverage sentinel missing")
package_path.write_text(package.replace(lint_anchor, lint_replacement, 1))
'''
          if script.count(write_anchor) != 1:
              raise SystemExit("helper write anchor missing")
          script = script.replace(write_anchor, cleanup_code, 1)

          prettier = "npx prettier --write mac-helper/src/sessionRuntimeController.js test/sessionRuntimeController.test.js\n"
          prettier_new = "npx prettier --write package.json scripts/architecture/baseline-policy.json mac-helper/src/sessionRuntimeController.js test/sessionRuntimeController.test.js\n"
          if script.count(prettier) != 1:
              raise SystemExit("prettier command sentinel missing")
          script = script.replace(prettier, prettier_new, 1)

          add_tail = "  test/sessionRuntimeController.test.js\n\nfiles=\"$(git diff --cached --name-only \"$BASE\" | sort)\"\n"
          add_replacement = "  package.json \\\n  scripts/architecture/baseline-policy.json \\\n  test/confirmationRound2State.test.js \\\n  test/sessionRuntimeController.test.js\n\nfiles=\"$(git diff --cached --name-only \"$BASE\" | sort)\"\n"
          if script.count(add_tail) != 1:
              raise SystemExit("git-add tail sentinel missing")
          script = script.replace(add_tail, add_replacement, 1)

          expected_tail = '  test/sessionRuntimeController.test.js | sort)"\n'
          expected_replacement = '  package.json \\\n  scripts/architecture/baseline-policy.json \\\n  test/confirmationRound2State.test.js \\\n  test/sessionRuntimeController.test.js | sort)"\n'
          if script.count(expected_tail) != 1:
              raise SystemExit("expected-file-set tail sentinel missing")
          script = script.replace(expected_tail, expected_replacement, 1)

          sentinel_anchor = "! grep -q 'async function proxyStream' mac-helper/bin/swift-sim-helper.js\n"
          sentinel_new = sentinel_anchor + (
              "grep -q 'async function fetchWithTimeout' mac-helper/bin/swift-sim-helper.js\n"
              "grep -q 'async function fetchWithTimeout' mac-helper/src/sessionRuntimeController.js\n"
              "! grep -q 'helper source persists failed starts' test/confirmationRound2State.test.js\n"
              "! grep -q 'test/confirmationRound2State.test.js' scripts/architecture/baseline-policy.json\n"
          )
          if script.count(sentinel_anchor) != 1:
              raise SystemExit("post-extraction sentinel anchor missing")
          script = script.replace(sentinel_anchor, sentinel_new, 1)

          Path("/tmp/publish.sh").write_text(script)
          PY
          bash /tmp/publish.sh
