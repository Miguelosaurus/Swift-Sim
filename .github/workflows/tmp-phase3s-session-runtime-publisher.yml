name: Temporary Phase 3S Session Runtime Publisher

on:
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Build, validate, and publish exact Phase 3S candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_VERIFY_RUN: "31430219744"
          BASE: b994cfa3d5a4f4a8aa5fe0aa8760a943745b2cb1
          SOURCE_BRANCH: agent/architecture-consolidation-phase-3r-remaining-cli-parser
          PRODUCT_BRANCH: agent/architecture-consolidation-phase-3s-session-runtime-controller
        run: python3 .github/tmp/phase3s-session-runtime-publisher.py
