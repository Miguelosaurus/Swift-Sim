name: Temporary Phase 3S Session Runtime Publisher

on:
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Run corrected Phase 3S publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_VERIFY_RUN: "31430219744"
          BASE: b994cfa3d5a4f4a8aa5fe0aa8760a943745b2cb1
          SOURCE_BRANCH: agent/architecture-consolidation-phase-3r-remaining-cli-parser
          PRODUCT_BRANCH: agent/architecture-consolidation-phase-3s-session-runtime-controller
        run: |
          set -euo pipefail
          git show ff551d4a171aacdb62248ab046b3d384a94e0317:.github/workflows/tmp-phase3s-session-runtime-publisher.yml > /tmp/original.yml
          python3 <<'PY'
          from pathlib import Path

          workflow = Path("/tmp/original.yml").read_text()
          marker = "        run: |\n"
          if workflow.count(marker) != 1:
              raise SystemExit("expected one original publisher run block")
          block = workflow.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith("          ") else line)
          script = "\n".join(lines) + "\n"

          replacements = {
              'block_start = helper.find("async function fetchWithTimeout(url, timeoutMs) {\\n")\nblock_end = helper.find("async function createDeviceBuild(values) {\\n", block_start)': 'fetch_start = helper.find("async function fetchWithTimeout(url, timeoutMs) {\\n")\nblock_start = helper.find("async function proxyStream(res, session) {\\n", fetch_start)\nblock_end = helper.find("async function createDeviceBuild(values) {\\n", block_start)',
              'if block_start < 0 or block_end < 0:\n    raise SystemExit("session runtime block sentinels missing")\nsession_block = helper[block_start:block_end].rstrip() + "\\n"': 'if fetch_start < 0 or block_start < 0 or block_end < 0:\n    raise SystemExit("session runtime block sentinels missing")\nfetch_block = helper[fetch_start:block_start].rstrip() + "\\n\\n"\nsession_block = helper[block_start:block_end].rstrip() + "\\n"',
              'module += indent(session_block, "  ")': 'module += indent(fetch_block + session_block, "  ")',
              'helper = helper[:block_start] + helper[block_end:]': 'remove_start = helper.find("async function proxyStream(res, session) {\\n")\nremove_end = helper.find("async function createDeviceBuild(values) {\\n", remove_start)\nif remove_start < 0 or remove_end < 0:\n    raise SystemExit("updated session removal sentinels missing")\nhelper = helper[:remove_start] + helper[remove_end:]',
          }
          for old, new in replacements.items():
              if script.count(old) != 1:
                  raise SystemExit(f"Phase 3S correction sentinel missing: {old}")
              script = script.replace(old, new, 1)
          Path("/tmp/publish.sh").write_text(script)
          PY
          bash /tmp/publish.sh
