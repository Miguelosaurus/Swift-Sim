name: Temporary Phase 3V Clean Diff Oracle

on:
  push:
    branches:
      - agent/tmp-phase3v-clean-diff-oracle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      BASE_SHA: db5d66b84aff7efbda69ee7383abe07424b296bd
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: db5d66b84aff7efbda69ee7383abe07424b296bd
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply Phase 3V without formatting legacy files
        shell: bash
        run: |
          set -euo pipefail
          git show origin/agent/tmp-phase3v-helper-presentation-oracle:.github/tmp/phase3v-helper-presentation.py > /tmp/phase3v.py
          git show origin/agent/tmp-phase3v-helper-presentation-oracle:.github/tmp/phase3v-helper-presentation-typefix.py > /tmp/phase3v-typefix.py
          git show origin/agent/tmp-phase3v-helper-presentation-oracle:.github/tmp/phase3v-source-test-fix.py > /tmp/phase3v-source-test-fix.py
          python3 /tmp/phase3v.py
          python3 /tmp/phase3v-typefix.py
          python3 /tmp/phase3v-source-test-fix.py
          npx prettier --write \
            mac-helper/src/http/helperPresentation.js \
            test/helperPresentation.test.js \
            test/publicGatewayAuthorizationMatrix.test.js
      - name: Focused behavior
        run: >-
          node --test
          test/helperPresentation.test.js
          test/publicGatewayAuthorizationMatrix.test.js
          test/deviceDelivery.test.js
          test/deviceBuildCapabilityRoutes.test.js
          test/deviceBuildCommandRoutes.test.js
          test/deviceAppRoutes.test.js
          test/sessionRoutes.test.js
          test/helperControlRoutes.test.js
          test/pairingPageRoutes.test.js
          test/cli.test.js
      - name: Strict types
        run: npm run check:types
      - name: Diff summary
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git diff --numstat
      - name: Commit exact clean candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Miguel"
          git config user.email "serram1994@gmail.com"
          git add \
            mac-helper/bin/swift-sim-helper.js \
            mac-helper/src/http/helperPresentation.js \
            test/helperPresentation.test.js \
            test/publicGatewayAuthorizationMatrix.test.js \
            test/cli.test.js
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "5"
          git commit -m "Phase 3V: extract helper presentation cleanly"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
      - name: Full Node/package gate
        shell: bash
        run: env -u GITHUB_EVENT_PATH -u GITHUB_EVENT_NAME npm run check
