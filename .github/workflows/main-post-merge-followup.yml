name: Main post-merge follow-up

on:
  push:
    branches: [agent/main-post-merge-review-round-1]

permissions:
  contents: write

concurrency:
  group: main-post-merge-followup
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, 'Trigger main post-merge follow-up') }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/main-post-merge-review-round-1
          fetch-depth: 0
      - id: guard
        run: |
          if [[ -f scripts/main_post_merge_followup.py ]]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.run == '1'
        run: python3 scripts/main_post_merge_followup.py
      - if: steps.guard.outputs.run == '1'
        run: git rm scripts/main_post_merge_followup.py .github/workflows/main-post-merge-followup.yml
      - if: steps.guard.outputs.run == '1'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - if: steps.guard.outputs.run == '1'
        run: npm ci
      - if: steps.guard.outputs.run == '1'
        run: npm run check
      - if: steps.guard.outputs.run == '1'
        name: Commit validated follow-up fixes
        run: |
          git config user.name "swift-sim-review-bot"
          git config user.email "swift-sim-review-bot@users.noreply.github.com"
          git add -A
          git commit -m "Apply main post-merge follow-up fixes"
          git push origin HEAD:agent/main-post-merge-review-round-1
