name: Main post-merge workspace fix

on:
  push:
    branches: [agent/main-post-merge-review-round-1]

permissions:
  contents: write

concurrency:
  group: main-post-merge-workspace-fix
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/main-post-merge-review-round-1
          fetch-depth: 0
      - name: Publish gate start marker
        run: |
          git config user.name "swift-sim-review-bot"
          git config user.email "swift-sim-review-bot@users.noreply.github.com"
          printf '%s\n' "Workspace transformation gate started from $GITHUB_SHA" > docs/MAIN_POST_MERGE_GATE_RUNNING
          git add docs/MAIN_POST_MERGE_GATE_RUNNING
          git commit -m "Begin main post-merge workspace gate"
          git push origin HEAD:agent/main-post-merge-review-round-1
      - id: guard
        run: |
          if [[ -f scripts/main_post_merge_workspace_fix.py ]]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.run == '1'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - id: apply
        if: steps.guard.outputs.run == '1'
        run: |
          set +e
          {
            python3 scripts/repair_workspace_transform_anchor.py
            python3 scripts/main_post_merge_workspace_fix.py
            python3 scripts/main_post_merge_classifier_fix.py
            npm ci
            node scripts/check-js-syntax.js
            npm run check:docs
          } > /tmp/main-post-merge-workspace-fix.log 2>&1
          status=$?
          cat /tmp/main-post-merge-workspace-fix.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - if: steps.guard.outputs.run == '1' && steps.apply.outputs.status != '0'
        name: Commit fail-closed diagnostic
        run: |
          git reset --hard HEAD
          git checkout c7090b14c6f1fd12af9c311b1954b79b00c415ac -- .github/workflows/verify.yml
          rm -f docs/MAIN_POST_MERGE_GATE_RUNNING
          cp /tmp/main-post-merge-workspace-fix.log docs/MAIN_POST_MERGE_WORKSPACE_FIX_ERROR.log
          git config user.name "swift-sim-review-bot"
          git config user.email "swift-sim-review-bot@users.noreply.github.com"
          git add -A
          git commit -m "Record workspace fix failure"
          git push origin HEAD:agent/main-post-merge-review-round-1
      - if: steps.guard.outputs.run == '1' && steps.apply.outputs.status == '0'
        name: Commit transformed candidate
        run: |
          git rm \
            scripts/repair_workspace_transform_anchor.py \
            scripts/main_post_merge_workspace_fix.py \
            scripts/main_post_merge_classifier_fix.py \
            .github/workflows/main-post-merge-workspace-fix.yml \
            docs/MAIN_POST_MERGE_GATE_RUNNING
          git rm -f docs/MAIN_POST_MERGE_WORKSPACE_FIX_ERROR.log
          git checkout c7090b14c6f1fd12af9c311b1954b79b00c415ac -- .github/workflows/verify.yml
          git config user.name "swift-sim-review-bot"
          git config user.email "swift-sim-review-bot@users.noreply.github.com"
          git add -A
          git commit -m "Apply main post-merge workspace and classifier fixes"
          git push origin HEAD:agent/main-post-merge-review-round-1
