name: Apply review round 4

on:
  push:
    branches: [agent/open-source-launch-hardening-round-1]
    paths:
      - scripts/apply-review-round-4.py
      - .github/workflows/apply-review-round-4.yml

permissions:
  contents: write

concurrency:
  group: apply-review-round-4
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/open-source-launch-hardening-round-1
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed fixes
        run: python3 scripts/apply-review-round-4.py
      - run: npm ci
      - run: npm run check
      - run: ruby -e 'require "yaml"; Dir[".github/**/*.{yml,yaml}"].each { |file| YAML.load_file(file); puts "Verified #{file}" }'
      - run: bash -n scripts/codex/build-device.sh scripts/codex/open-simulator-session.sh scripts/release/render-homebrew-formula.sh
      - name: Run signed iOS tests
        timeout-minutes: 12
        run: |
          set -euo pipefail
          DESTINATION=$(python3 - <<'PY'
          import json, subprocess
          payload = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime, devices in payload.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  udid = device.get("udid")
                  if udid:
                      print(f"platform=iOS Simulator,id={udid}")
                      raise SystemExit
          raise SystemExit("No available iOS Simulator found")
          PY
          )
          xcodebuild test \
            -project Companion/SwiftSimCompanion.xcodeproj \
            -scheme SwiftSimCompanion \
            -destination "$DESTINATION" \
            -configuration Debug \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 30 \
            -maximum-test-execution-time-allowance 60
      - name: Commit validated fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-review-round-4.py .github/workflows/apply-review-round-4.yml
          git add -A
          git commit -m "Harden renewal and lifecycle races"
          git push origin HEAD:agent/open-source-launch-hardening-round-1

# Trigger after workflow registration.
