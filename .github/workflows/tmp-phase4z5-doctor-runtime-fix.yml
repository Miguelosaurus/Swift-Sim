name: Temporary Phase 4Z5 doctor runtime fix publisher

on:
  push:
    branches:
      - agent/architecture-consolidation-phase-4z5-doctor-artifact-audit

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fix doctor audit invocation and add entrypoint regression
        run: |
          python - <<'PY'
          from pathlib import Path

          cli = Path("mac-helper/bin/swift-sim.js")
          text = cli.read_text()
          old = '  const setup = runHelperJSON(["setup-status"]);\n  const codex = findCodexCommand();'
          new = '''  const setup = runHelperJSON(["setup-status"]);
          const artifactAudit = includeStorage
            ? runHelperJSON(["device-build-artifact-audit"])
            : null;
          const codex = findCodexCommand();'''
          if text.count(old) != 1:
              raise SystemExit("doctor artifact-audit invocation anchor mismatch")
          cli.write_text(text.replace(old, new, 1))

          test_file = Path("test/cli.test.js")
          text = test_file.read_text()
          old = '''    assert.equal(report.deviceInstalls.agents.claude.ready, false);
              assert.match(report.deviceInstalls.agents.claude.detail, /does not match/);'''
          new = '''    assert.equal(report.deviceInstalls.agents.claude.ready, false);
              assert.match(report.deviceInstalls.agents.claude.detail, /does not match/);
              assert.equal(report.storage.artifacts.available, true);
              assert.equal(report.storage.artifacts.informational, true);
              assert.equal(report.storage.artifacts.cleanupEnabled, false);'''
          if text.count(old) != 1:
              raise SystemExit("doctor storage regression anchor mismatch")
          test_file.write_text(text.replace(old, new, 1))
          PY
      - name: Validate exact doctor runtime path
        run: |
          node --check mac-helper/bin/swift-sim.js
          node --test --test-name-pattern="doctor reports stale Codex and Claude integrations" test/cli.test.js
          npm run check:types
          npm run check:architecture
          git diff --check
          tmp_home="$(mktemp -d)"
          HOME="$tmp_home" node mac-helper/bin/swift-sim.js doctor --json > "$tmp_home/doctor.json"
          node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const artifacts = value.storage?.artifacts;
            if (!artifacts || artifacts.available !== true) process.exit(1);
            if (artifacts.informational !== true || artifacts.cleanupEnabled !== false) process.exit(1);
          ' "$tmp_home/doctor.json"
          if [ -e "$tmp_home/.swift-sim" ]; then
            echo "Doctor audit unexpectedly created Swift Sim state" >&2
            find "$tmp_home/.swift-sim" -maxdepth 3 -print >&2 || true
            exit 1
          fi
          rm -rf "$tmp_home"
      - name: Publish runtime correction and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mac-helper/bin/swift-sim.js test/cli.test.js
          git rm .github/workflows/tmp-phase4z5-doctor-runtime-fix.yml
          git commit -m "fix: invoke artifact audit from doctor"
          git push origin HEAD:agent/architecture-consolidation-phase-4z5-doctor-artifact-audit
