name: Main post-merge autofix

on:
  push:
    branches: [agent/main-post-merge-review-round-1]

permissions:
  contents: write

concurrency:
  group: main-post-merge-autofix
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply main post-merge review fixes') }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/main-post-merge-review-round-1
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: node scripts/main-post-merge-autofix.mjs
      - run: git rm scripts/main-post-merge-autofix.mjs .github/workflows/main-post-merge-autofix.yml
      - run: npm ci
      - run: npm run check
      - name: Commit validated fixes
        run: |
          git config user.name "swift-sim-review-bot"
          git config user.email "swift-sim-review-bot@users.noreply.github.com"
          git add -A
          git commit -m "Apply main post-merge review fixes"
          git push origin HEAD:agent/main-post-merge-review-round-1
