name: Round 3 Apply

on:
  push:
    branches:
      - agent/open-source-launch-hardening-round-3-work

permissions:
  contents: write

concurrency:
  group: round3-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Apply round 3 fixes
        run: python3 scripts/apply-round3.py
      - run: npm ci
      - run: npm run check
      - run: |
          ruby -e 'require "yaml"; Dir[".github/**/*.{yml,yaml}"].each { |file| YAML.load_file(file); puts "Verified #{file}" }'
      - run: bash -n scripts/codex/build-device.sh scripts/codex/open-simulator-session.sh scripts/release/render-homebrew-formula.sh
      - name: Run iOS app tests
        timeout-minutes: 12
        run: |
          set -euo pipefail
          DESTINATION=$(python3 - <<'PY'
          import json, subprocess
          payload = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime, devices in payload.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  udid = device.get("udid")
                  if udid:
                      print(f"platform=iOS Simulator,id={udid}")
                      raise SystemExit
          raise SystemExit("No available iOS Simulator found")
          PY
          )
          xcodebuild test \
            -project Companion/SwiftSimCompanion.xcodeproj \
            -scheme SwiftSimCompanion \
            -destination "$DESTINATION" \
            -configuration Debug \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 30 \
            -maximum-test-execution-time-allowance 60
      - name: Commit validated changes
        run: |
          git config user.name "swift-sim-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix round 3 lifecycle findings"
          git push origin HEAD:agent/open-source-launch-hardening-round-3-work
