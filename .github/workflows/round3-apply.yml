name: Round 3 Tree Record

on:
  push:
    branches:
      - agent/open-source-launch-hardening-round-3-work
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Compute clean tree
        env:
          BASE_COMMIT: 24f975b38e8134aa0b58cf2c75d7d8fef110eba0
        run: |
          set -euo pipefail
          FILES=(
            Companion/SwiftSimCompanion/SessionStore.swift
            Companion/SwiftSimCompanion/SwiftSimCompanionApp.swift
            Companion/SwiftSimCompanionTests/InstallationStateTests.swift
            mac-helper/bin/swift-sim-helper.js
            mac-helper/src/deviceBuildStore.js
            mac-helper/src/deviceBuilderCore.js
            mac-helper/src/deviceDelivery.js
            test/deviceBuildStore.test.js
            test/deviceBuilderTimeout.test.js
            test/deviceDelivery.test.js
          )
          export GIT_INDEX_FILE="$RUNNER_TEMP/round3-clean-index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "$BASE_COMMIT"
          for file in "${FILES[@]}"; do
            mode=$(git ls-tree HEAD -- "$file" | awk '{print $1}')
            blob=$(git rev-parse "HEAD:$file")
            git update-index --add --cacheinfo "$mode,$blob,$file"
          done
          tree=$(git write-tree)
          printf '%s\n' "$tree" > docs/ROUND3_CLEAN_TREE.txt
          echo "Clean tree: $tree"
      - name: Publish tree record
        if: github.event_name == 'push'
        run: |
          git config user.name "swift-sim-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ROUND3_CLEAN_TREE.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record clean round 3 tree"
          git push origin HEAD:agent/open-source-launch-hardening-round-3-work
