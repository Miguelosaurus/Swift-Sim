name: Temporary Phase 4V publisher

on:
  push:
    branches:
      - agent/architecture-consolidation-phase-4v-historical-device-build-upgrade

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply historical compatibility upgrade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mac-helper/src/persistence/deviceBuildLockedLegacySnapshot.js')
          text = path.read_text()
          old = '''function normalizeBuildArray(value, sourcePath) {
            if (value === undefined || value === null) return [];
            if (!Array.isArray(value)) {
              throw new Error(`Device-build legacy builds must be an array: ${sourcePath}.`);
            }
            return value.map((build) => normalizeDeviceBuildRecord(structuredClone(build)));
          }
          '''
          new = '''function normalizeBuildArray(value, sourcePath) {
            if (value === undefined || value === null) return [];
            if (!Array.isArray(value)) {
              throw new Error(`Device-build legacy builds must be an array: ${sourcePath}.`);
            }
            return value.map((build, index) => {
              const record = cloneRecord(build, `Device-build legacy build ${index}`);
              return normalizeDeviceBuildRecord(upgradeLegacyDeviceBuildRecord(record));
            });
          }

          /**
           * Historical v6 files may predate fields that are now required by the
           * strict persistence contract. Upgrade only omissions with known legacy
           * defaults; present-but-malformed values still flow to strict validation.
           *
           * @param {Record<string, unknown>} build
           */
          function upgradeLegacyDeviceBuildRecord(build) {
            if (!Object.prototype.hasOwnProperty.call(build, "delivery")) {
              build.delivery = {
                mode: "quick-tunnel",
                provider: "cloudflare-quick-tunnel",
                expiresAt: "",
              };
            }

            const signingValue = build.signing;
            const signing =
              signingValue && typeof signingValue === "object" && !Array.isArray(signingValue)
                ? /** @type {Record<string, unknown>} */ (signingValue)
                : null;
            if (
              signing &&
              !Object.prototype.hasOwnProperty.call(signing, "deviceInstallable")
            ) {
              signing.deviceInstallable = false;
            }
            return build;
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one normalizeBuildArray block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Format and focused validation
        run: |
          npx prettier --write mac-helper/src/persistence/deviceBuildLockedLegacySnapshot.js
          node --test test/deviceBuildLegacyCompatibility.test.js
          npm run check:types
          npm run check:architecture
          git diff --check
      - name: Publish product commit
        run: |
          rm .github/workflows/tmp-phase4v-publisher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mac-helper/src/persistence/deviceBuildLockedLegacySnapshot.js test/deviceBuildLegacyCompatibility.test.js .github/workflows/tmp-phase4v-publisher.yml
          git commit -m 'fix: upgrade historical device-build records'
          git push
