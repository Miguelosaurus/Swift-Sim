name: Apply PR21 Generic Lock Ownership

on:
  push:
    branches: [agent/main-post-merge-review-round-1]
    paths:
      - .github/workflows/apply-pr21-generic-lock-ownership.yml

permissions:
  contents: write

concurrency:
  group: apply-pr21-generic-lock-ownership
  cancel-in-progress: false

jobs:
  transform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/main-post-merge-review-round-1
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Apply manual review fix
        run: python3 scripts/apply-pr21-generic-lock-ownership.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused regressions
        run: node --test test/lockOwnershipPreload.test.js test/confirmationRound5AtomicLockRemoval.test.js
      - name: Validate JavaScript syntax
        run: |
          node --check mac-helper/src/lockOwnershipPreload.js
          node --check test/lockOwnershipPreload.test.js
      - name: Publish self-cleaned candidate
        env:
          BRANCH: agent/main-post-merge-review-round-1
        run: |
          set -euo pipefail
          git config user.name "swift-sim-review-bot"
          git config user.email "swift-sim-review-bot@users.noreply.github.com"
          git rm .github/workflows/apply-pr21-generic-lock-ownership.yml scripts/apply-pr21-generic-lock-ownership.py
          git add -A
          git commit -m "Bind generic lock ownership to exact state"
          git push origin "HEAD:${BRANCH}"
