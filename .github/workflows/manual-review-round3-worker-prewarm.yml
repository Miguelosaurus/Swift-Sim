name: Final worker identity prewarm

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: final-worker-prewarm-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/main-post-merge-review-round-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/main-post-merge-review-round-1
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply worker prewarm fix
        run: python3 scripts/manual-review-round3-worker-prewarm.py
      - name: Install dependencies
        run: npm ci
      - name: Focused worker and integration regressions
        run: >-
          node --test
          test/mainPostMergeIntegration.test.js
          test/deviceBuilderTimeout.test.js
          test/deviceBuilderRecovery.test.js
      - name: Check JavaScript syntax
        run: node scripts/check-js-syntax.js
      - name: Check documentation links
        run: npm run check:docs
      - name: Commit worker prewarm fix
        shell: bash
        run: |
          git config user.name "Swift Sim Manual Review"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: prepare worker identity before spawn"
          git pull --rebase origin agent/main-post-merge-review-round-1
          git push origin HEAD:agent/main-post-merge-review-round-1
