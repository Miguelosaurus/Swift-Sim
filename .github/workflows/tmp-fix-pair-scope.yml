name: Temporary pair scope correction

on:
  push:
    branches:
      - agent/arch-ws-P4-INTEGRATION-serialized-phase4

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Remove stray doctor-only audit lookup from pair command
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mac-helper/bin/swift-sim.js')
          text = path.read_text()
          start = text.index('async function pair(args) {')
          end = text.index('\nfunction normalizeURL', start)
          block = text[start:end]
          needle = '''  const artifactAudit = includeStorage\n    ? runHelperJSON(["device-build-artifact-audit"])\n    : null;\n'''
          if block.count(needle) != 1:
              raise SystemExit(f'expected exactly one stray artifact audit declaration in pair(); found {block.count(needle)}')
          block = block.replace(needle, '', 1)
          text = text[:start] + block + text[end:]
          path.write_text(text)
          PY
      - name: Fast validation
        run: |
          node --check mac-helper/bin/swift-sim.js
          if sed -n '/async function pair(args)/,/^function normalizeURL/p' mac-helper/bin/swift-sim.js | grep -q 'includeStorage'; then
            echo 'pair() still references includeStorage' >&2
            exit 1
          fi
          sed -n '/async function buildDoctorReport/,/^}/p' mac-helper/bin/swift-sim.js | grep -q 'const artifactAudit = includeStorage'
      - name: Publish product correction and remove temporary workflow
        run: |
          git config user.name 'swift-sim-orchestrator-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/tmp-fix-pair-scope.yml
          git add mac-helper/bin/swift-sim.js
          git diff --cached --check
          git commit -m 'Fix pair command artifact audit scope leak'
          git push origin HEAD:agent/arch-ws-P4-INTEGRATION-serialized-phase4
