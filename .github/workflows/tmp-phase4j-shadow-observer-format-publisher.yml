name: Temporary Phase 4J Shadow Observer Format Publisher

on:
  push:
    branches:
      - agent/tmp-phase4j-shadow-observer-format-publisher

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: f21393542408fa2a95efa11fef6e7cfabf68296b
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Publish exact formatted files to temporary output branch
        shell: bash
        run: |
          npx prettier --write mac-helper/src/persistence/deviceBuildShadowObserver.js test/deviceBuildShadowObserver.test.ts
          git config user.name "swift-sim-phase4j-oracle"
          git config user.email "actions@users.noreply.github.com"
          git add mac-helper/src/persistence/deviceBuildShadowObserver.js test/deviceBuildShadowObserver.test.ts
          git commit -m "Format Phase 4J shadow observer"
          git push origin HEAD:refs/heads/agent/tmp-phase4j-shadow-observer-formatted-output
