name: Round 4 Apply

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: round4-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Apply round 4 fixes
        run: |
          set -euo pipefail
          if ! grep -q 'testThreeStagedPairingsCanCancelBackToTheFirstCredential' Companion/SwiftSimCompanionTests/InstallationStateTests.swift; then
            python3 scripts/round4_store.py
            python3 scripts/round4_backend.py
            python3 scripts/round4_swift.py
            python3 scripts/round4_fix1.py
            python3 scripts/round4_tests.py
          fi
          python3 scripts/round4_fix2.py
          python3 scripts/round4_fix3.py
          git diff --check
      - run: npm ci
      - run: npm run check
      - run: |
          ruby -e 'require "yaml"; Dir[".github/**/*.{yml,yaml}"].each { |file| YAML.load_file(file); puts "Verified #{file}" }'
      - run: bash -n scripts/codex/build-device.sh scripts/codex/open-simulator-session.sh scripts/release/render-homebrew-formula.sh
      - name: Run iOS app tests
        timeout-minutes: 12
        run: |
          set -euo pipefail
          DESTINATION=$(python3 - <<'PY'
          import json, subprocess
          payload = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime, devices in payload.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  udid = device.get("udid")
                  if udid:
                      print(f"platform=iOS Simulator,id={udid}")
                      raise SystemExit
          raise SystemExit("No available iOS Simulator found")
          PY
          )
          xcodebuild test \
            -project Companion/SwiftSimCompanion.xcodeproj \
            -scheme SwiftSimCompanion \
            -destination "$DESTINATION" \
            -configuration Debug \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 30 \
            -maximum-test-execution-time-allowance 60
      - name: Commit validated source
        run: |
          set -euo pipefail
          FILES=(
            Companion/SwiftSimCompanion/SessionStore.swift
            Companion/SwiftSimCompanion/SwiftSimCompanionApp.swift
            Companion/SwiftSimCompanionTests/InstallationStateTests.swift
            mac-helper/bin/swift-sim-helper.js
            mac-helper/src/buildValidation.js
            mac-helper/src/deviceBuildStore.js
            mac-helper/src/deviceBuildStoreCore.js
            mac-helper/src/deviceBuilderCore.js
            test/buildValidation.test.js
            test/deviceBuildStore.test.js
            test/deviceBuilderTimeout.test.js
          )
          if git diff --quiet -- "${FILES[@]}"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${FILES[@]}"
          git commit -m "Fix round 4 lifecycle findings"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
