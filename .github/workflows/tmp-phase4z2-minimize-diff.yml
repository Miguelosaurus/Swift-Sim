name: Temporary Phase 4Z2 diff minimizer

on:
  push:
    branches:
      - agent/architecture-consolidation-phase-4z2-wire-future-artifact-retention

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Restore legacy formatting and reapply semantic edits
        run: |
          git checkout 2fa0130315b18c50dcc5bfe0344dabafa4334bf3 -- \
            mac-helper/bin/swift-sim-helper.js \
            mac-helper/src/deviceBuildStore.js \
            mac-helper/src/deviceBuildRuntimeController.js \
            test/deviceBuildStore.test.js \
            test/deviceBuildRuntimeController.test.js
          git show f04aa0d2f828c9141c73453351d211fe9845e775:scripts/tmp-phase4z2-publish.py > /tmp/phase4z2-apply.py
          python3 /tmp/phase4z2-apply.py
          npx prettier --write mac-helper/src/deviceBuildRuntimeController.js
      - name: Focused validation
        run: |
          node --test --test-concurrency=1 test/deviceBuildArtifactRetention.test.js test/deviceBuildStore.test.js test/deviceBuildRuntimeController.test.js
          npm run check:types
          npm run check:architecture
          git diff --check
      - name: Publish minimal-diff correction
        run: |
          rm .github/workflows/tmp-phase4z2-minimize-diff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mac-helper/bin/swift-sim-helper.js mac-helper/src/deviceBuildStore.js mac-helper/src/deviceBuildRuntimeController.js test/deviceBuildStore.test.js test/deviceBuildRuntimeController.test.js .github/workflows/tmp-phase4z2-minimize-diff.yml
          git commit -m 'chore: minimize Phase 4Z2 legacy diff churn'
          git push
